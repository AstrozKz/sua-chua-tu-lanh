/* ---------- 2. đăng ký dự thi ---------- */
function reg(ex){
  if(!ex){home();return}
  const who=S.get('exam_who',{name:'',cls:''});const pw=pwFor(ex);const n=Math.min(ex.soCau,bankSize(ex.ch));
  const scope=ex.ch.length===CH.length?'Toàn bộ mô đun':ex.ch.map(k=>CHN[k][1]==='Chuyên đề'?'Inverter':CHN[k][1]).join(', ');
  view(`<div class="exw narrow"><button class="exback" data-go="home">‹ Danh sách bài thi</button>
   <div class="excard"><div class="exk">${GRPN[ex.grp]||'Bài thi'}</div><h2>${esc(ex.ten)}</h2>
   <div class="exmeta"><span>${IC.clip}${n} câu trắc nghiệm</span><span>${IC.clock}${ex.phut} phút</span><span class="sc">Phạm vi: ${esc(scope)}</span></div>
   <form class="exform" novalidate autocomplete="on">
    <label><span>Họ và tên</span><input name="name" maxlength="60" autocomplete="name" value="${esc(who.name)}" placeholder="Ví dụ: Nguyễn Văn An" required></label>
    <label><span>Lớp</span>${CLASSES.length?`<select name="cls"><option value="">– Chọn lớp –</option>${CLASSES.map(c=>`<option${c===who.cls?' selected':''}>${esc(c)}</option>`).join('')}</select>`:`<input name="cls" maxlength="30" value="${esc(who.cls)}" placeholder="Ví dụ: KTML K25A" required>`}</label>
    ${pw?'<label><span>Mật khẩu bài thi <small>(giáo viên cung cấp)</small></span><input name="pw" type="password" maxlength="40" autocomplete="off"></label>':''}
    <label class="chk"><input type="checkbox" name="ok"><span>Em cam kết tự làm bài, không xem tài liệu, không nhờ người khác làm hộ.</span></label>
    <div class="exerr" role="alert"></div>
    <button class="exbtn pri xl" type="submit">Bắt đầu làm bài</button></form>
   <ul class="exrules"><li>Mỗi câu chỉ có <b>1 đáp án đúng</b>. Câu bỏ trống không có điểm.</li><li>Được chuyển qua lại giữa các câu và đổi đáp án trước khi nộp.</li><li><b>Hết giờ, bài tự động nộp.</b> Đề và thứ tự đáp án của mỗi bạn khác nhau.</li><li>Không thoát ra ngoài trong khi làm bài: số lần rời màn hình được ghi lại và gửi cho giáo viên.</li><li>Lỡ tải lại trang hoặc mất mạng: bài làm vẫn được giữ trên máy, mở lại để làm tiếp.</li></ul>
   </div></div>`,'close');
  bodyEl.querySelector('[data-go=home]').onclick=home;
  const f=bodyEl.querySelector('form'),err=bodyEl.querySelector('.exerr');
  f.onsubmit=e=>{e.preventDefault();
    const name=normName(f.name.value),cls=String(f.cls.value||'').replace(/\s+/g,' ').trim().toUpperCase();
    let m='';
    if(name.split(' ').length<2||name.length<5||!/^[\p{L}\s.'-]+$/u.test(name))m='Em hãy nhập đầy đủ họ và tên (có dấu), ví dụ: Nguyễn Văn An.';
    else if(!cls)m='Em hãy nhập (hoặc chọn) lớp.';
    else if(pw&&String(f.pw.value).trim()!==pw)m='Mật khẩu bài thi chưa đúng. Hỏi giáo viên mật khẩu.';
    else if(!f.ok.checked)m='Em đánh dấu vào ô cam kết trước khi bắt đầu.';
    else if(!bankSize(ex.ch))m='Ngân hàng chưa có câu hỏi cho bài thi này. Em báo giáo viên nhé.';
    if(m){err.textContent=m;return}
    S.set('exam_who',{name,cls});start(ex,name,cls)};
}

/* ---------- 3. làm bài ---------- */
function start(ex,name,cls){
  const qs=buildPaper(ex);const t0=Date.now();
  st={v:1,sid:sidNew(),ex:ex.id,meta:{id:ex.id,ten:ex.ten,lab:ex.lab,grp:ex.grp,xem:ex.xem,phut:ex.phut},name,cls,qs,ans:qs.map(()=>null),flag:qs.map(()=>0),i:0,t0,t1:t0+ex.phut*60000,leaves:0,done:false};
  save();run();
}
function save(){if(st&&!st.done)S.set('exam_run',st)}
function resume(){const r=S.get('exam_run',null);if(!r||r.done||!metaOf(r)){S.del('exam_run');home();return}st=r;
  if(Date.now()>=st.t1){finish('timeout_away');return}run()}
function run(){
  const ex=metaOf(st);sideOpen=false;
  view(`<div class="exrun"><div class="exmainq">
    <div class="exq-head"><div class="exq-n"></div><button type="button" class="exflag">${IC.flag}<span>Đánh dấu xem lại</span></button></div>
    <div class="exbar" aria-hidden="true"><i></i></div>
    <div class="exq-t" id="exq-t"></div>
    <div class="exops" role="radiogroup" aria-labelledby="exq-t"></div>
    <div class="exnav"><button type="button" class="exbtn pv"><span class="lg">‹ Câu trước</span><span class="sh">‹ Trước</span></button><button type="button" class="exbtn gr">${IC.grid}<span class="gc"></span></button><button type="button" class="exbtn pri nx"></button></div>
    <p class="exwho">${esc(st.name)} · Lớp ${esc(st.cls)} · ${esc(ex.ten)}</p></div>
   <aside class="exside"><div class="exside-h"><b>Bảng câu hỏi</b><button type="button" class="exside-x" aria-label="Đóng">×</button></div><div class="exgridq"></div>
    <div class="exlegend"><span><i class="a"></i>Đã trả lời</span><span><i></i>Chưa trả lời</span><span><i class="f"></i>Đánh dấu</span></div>
    <button type="button" class="exbtn go xl">Nộp bài</button></aside></div>`,'submit','run');
  const q=s=>bodyEl.querySelector(s);
  q('.pv').onclick=()=>go(st.i-1);q('.nx').onclick=()=>{if(st.i<st.qs.length-1)go(st.i+1);else askSubmit()};
  q('.gr').onclick=()=>toggleSide(true);q('.exside-x').onclick=()=>toggleSide(false);
  q('.exside .go').onclick=askSubmit;
  q('.exflag').onclick=()=>{st.flag[st.i]=st.flag[st.i]?0:1;save();paint()};
  q('.exops').addEventListener('click',e=>{const b=e.target.closest('.exop');if(!b)return;st.ans[st.i]=+b.dataset.o;save();paint()});
  q('.exgridq').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;toggleSide(false);go(+b.dataset.k)});
  paint();startTick();
}
function toggleSide(v){sideOpen=v;root.classList.toggle('side',v)}
function go(i){if(!st||i<0||i>=st.qs.length)return;st.i=i;save();paint();const t=bodyEl.querySelector('.exmainq');if(t)t.scrollIntoView({block:'start'});bodyEl.scrollTop=0}
function paint(){
  const n=st.qs.length,i=st.i,d=st.qs[i],a=st.ans[i],done=st.ans.filter(x=>x!=null).length;
  const q=s=>bodyEl.querySelector(s);if(!q('.exops'))return;
  q('.exq-n').innerHTML=`Câu <b>${i+1}</b> / ${n}`;
  q('.exq-t').innerHTML=(d.img?`<img class="exq-img" src="${esc(d.img)}" alt="Hình minh họa" onerror="this.style.display='none'">`:'')+esc(d.q);
  q('.exops').innerHTML=d.o.map((o,k)=>`<button type="button" class="exop${a===k?' on':''}" role="radio" aria-checked="${a===k}" data-o="${k}"><span class="L">${'ABCD'[k]}</span><span class="tx">${esc(o)}</span></button>`).join('');
  q('.exflag').classList.toggle('on',!!st.flag[i]);
  q('.exbar i').style.width=(done/n*100)+'%';
  q('.gc').textContent=`${done}/${n} đã làm`;
  q('.pv').disabled=i===0;q('.nx').innerHTML=i===n-1?'Nộp bài':'<span class="lg">Câu sau ›</span><span class="sh">Sau ›</span>';q('.nx').classList.toggle('last',i===n-1);
  q('.exgridq').innerHTML=st.qs.map((_,k)=>`<button type="button" data-k="${k}" class="${st.ans[k]!=null?'a':''}${st.flag[k]?' f':''}${k===i?' now':''}" aria-label="Câu ${k+1}${st.ans[k]!=null?', đã trả lời':''}">${k+1}</button>`).join('');
}
function startTick(){clearInterval(tick);const upd=()=>{if(!st||st.done){clearInterval(tick);return}const left=(st.t1-Date.now())/1000;
  tmEl.innerHTML=IC.clock+'<span>'+mmss(left)+'</span>';tmEl.classList.toggle('low',left<=300&&left>60);tmEl.classList.toggle('crit',left<=60);
  tmEl.setAttribute('aria-label','Thời gian còn lại '+mmss(left));if(left<=0)finish('timeout')};upd();tick=setInterval(upd,250)}
function askSubmit(){if(!st||st.done)return;const n=st.qs.length,miss=st.ans.filter(x=>x==null).length,fl=st.flag.filter(Boolean).length;
  dialog(`<h3>Nộp bài?</h3><p>${miss?`Em còn <b class="c-bad">${miss} câu chưa trả lời</b>. `:'Em đã trả lời đủ '+n+' câu. '}${fl?`Có ${fl} câu đang đánh dấu xem lại. `:''}Sau khi nộp sẽ không sửa được bài.</p>`,
   [['Làm tiếp',''],['Nộp bài','sub']],v=>{if(v==='sub')finish('user')})}
function dialog(html,btns,cb){modal.innerHTML=`<div class="exdlg" role="alertdialog" aria-modal="true">${html}<div class="exdlg-b">${btns.map(([t,v])=>`<button type="button" class="exbtn ${v?'pri':''}" data-v="${v}">${t}</button>`).join('')}</div></div>`;
  modal.hidden=false;const bs=modal.querySelectorAll('button');bs.forEach(b=>b.onclick=()=>{modal.hidden=true;cb&&cb(b.dataset.v)});try{bs[bs.length-1].focus()}catch(e){}}
function onVis(){if(!st||st.done||!opened)return;
  if(document.hidden){st.leaves++;save()}
  else if(st.leaves>warnShown){warnShown=st.leaves;const w=root.querySelector('.exr-warn');w.innerHTML=`Em đã rời khỏi màn hình thi <b>${st.leaves} lần</b>. Số lần này được ghi lại và gửi cho giáo viên.<button type="button" aria-label="Đóng">×</button>`;w.hidden=false;
    w.querySelector('button').onclick=()=>w.hidden=true;clearTimeout(onVis.t);onVis.t=setTimeout(()=>w.hidden=true,7000)}}
function onKey(e){if(!opened)return;
  if(!modal.hidden){if(e.key==='Escape'){modal.hidden=true;e.preventDefault()}e.stopPropagation();return}
  const t=e.target,typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT');
  if(st&&!st.done&&!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    const m={'1':0,'2':1,'3':2,'4':3,a:0,b:1,c:2,d:3}[e.key.toLowerCase()];
    if(m!=null&&m<st.qs[st.i].o.length){st.ans[st.i]=m;save();paint();e.preventDefault()}
    else if(e.key==='ArrowRight'||e.key==='Enter'&&t===document.body){go(st.i+1);e.preventDefault()}
    else if(e.key==='ArrowLeft'){go(st.i-1);e.preventDefault()}
    else if(e.key==='Escape'&&sideOpen){toggleSide(false)}
  }else if(e.key==='Escape'&&!typing&&!(st&&!st.done)){close();e.preventDefault()}
  e.stopPropagation();
}

/* ---------- 4. chấm điểm, kết quả ---------- */
function finish(why){
  if(!st||st.done)return;clearInterval(tick);
  const ex=metaOf(st),n=st.qs.length;let correct=0;const det=[];
  st.qs.forEach((q,k)=>{const a=st.ans[k],ok=a!=null&&a===q.a;if(ok)correct++;
    const L=i=>i==null?'-':'ABCD'[q.m[i]];det.push(q.id+':'+(ok?L(a)+'+':L(a)+'/'+L(q.a)))});
  const tEnd=Math.min(Date.now(),st.t1),dur=Math.round((tEnd-st.t0)/1000);
  const score=Math.round(correct/n*10*100)/100;
  st.done=true;st.why=why;st.correct=correct;st.score=score;st.dur=dur;st.tEnd=Date.now();
  const p={action:'submit',sid:st.sid,name:st.name,cls:st.cls,exam:ex.id,examName:ex.ten,total:n,correct,score:score.toFixed(2),
    dur:durTxt(dur),durSec:dur,leaves:st.leaves,dev:device(),t0:st.t0,note:why==='user'?'':why==='timeout'?'Hết giờ, tự nộp':'Hết giờ khi rời trang, tự nộp',detail:det.join(' '),ver:VER};
  const h=S.get('exam_hist',[]);h.push({sid:st.sid,ex:ex.id,lab:ex.lab,name:st.name,cls:st.cls,score,correct,total:n,ts:st.tEnd,sent:0});S.set('exam_hist',h.slice(-60));
  if(LINK){const P=pend();P.push(p);setPend(P.slice(-50))}
  S.del('exam_run');
  result(p);
}
function result(p){
  const ex=metaOf(st),n=st.qs.length,canReview=ex.xem!==false;
  view(`<div class="exw narrow"><div class="excard exres">
   ${st.why!=='user'?`<div class="exnote alert">${st.why==='timeout'?'Hết giờ – bài thi đã được nộp tự động.':'Thời gian làm bài đã hết trong lúc em rời trang – bài đã được nộp tự động.'}</div>`:''}
   <div class="exk">Kết quả bài thi</div><h2>${esc(ex.ten)}</h2>
   <div class="exscore ${st.score>=5?'pass':'fail'}"><b>${fmtScore(st.score)}</b><span>/ 10 điểm</span><em>${rank(st.score)}</em></div>
   <div class="exstat"><div><b>${st.correct}/${n}</b><span>câu đúng</span></div><div><b>${mmss(st.dur)}</b><span>thời gian làm</span></div><div><b>${st.leaves}</b><span>lần rời màn hình</span></div></div>
   <p class="exwho2">Thí sinh: <b>${esc(st.name)}</b> – Lớp <b>${esc(st.cls)}</b><br>Nộp lúc ${dt(st.tEnd)} · Mã bài: ${esc(st.sid)}</p>
   <div class="exsend"></div>
   <div class="exbtns">${canReview?'<button type="button" class="exbtn" data-go="rev">Xem lại bài làm</button>':''}<button type="button" class="exbtn pri" data-go="home">Về danh sách bài thi</button></div>
   ${canReview?'':'<p class="exsmall">Bài thi này không hiển thị đáp án. Giáo viên sẽ chữa bài trên lớp.</p>'}
   </div><div class="exrev"></div></div>`,'close','result');
  bodyEl.querySelector('[data-go=home]').onclick=home;
  const rv=bodyEl.querySelector('[data-go=rev]');if(rv)rv.onclick=()=>{review();rv.disabled=true};
  const box=bodyEl.querySelector('.exsend');
  const show=(cls,html)=>{box.className='exsend '+cls;box.innerHTML=html;const b=box.querySelector('button');if(b)b.onclick=()=>doSend(true)};
  async function doSend(retry){
    if(!LINK){show('lc','Phần thi chưa kết nối Google Sheet nên kết quả <b>chỉ lưu trên máy này</b>. Em hãy <b>chụp màn hình</b> kết quả này gửi giáo viên.');return}
    show('wait','<i class="sp"></i>Đang gửi kết quả cho giáo viên…');
    const r=await sendOne(p,!retry);
    if(r==='ok')show('ok','✓ Đã gửi kết quả về giáo viên.');
    else show('pd',`Chưa gửi được kết quả (mạng yếu hoặc mất kết nối). Kết quả đã lưu trên máy và sẽ tự gửi lại khi em mở phần thi. <button type="button" class="exbtn mini">Gửi lại ngay</button>`);
  }
  doSend(false);
}
function review(){
  const box=bodyEl.querySelector('.exrev');
  box.innerHTML='<h3>Xem lại bài làm</h3>'+st.qs.map((q,k)=>{const a=st.ans[k],ok=a===q.a;
    return `<div class="exrv ${ok?'ok':'no'}"><div class="exrv-h"><b>Câu ${k+1}</b><span>${ok?'Đúng':a==null?'Bỏ trống':'Sai'}</span></div><p class="q">${q.img?`<img class="exq-img sm" src="${esc(q.img)}" alt="" onerror="this.style.display='none'">`:''}${esc(q.q)}</p>
     <ul>${q.o.map((o,i)=>`<li class="${i===q.a?'r':''}${i===a&&!ok?' w':''}"><span class="L">${'ABCD'[i]}</span>${esc(o)}${i===a?'<em>em chọn</em>':''}</li>`).join('')}</ul>${q.e?`<p class="e">${esc(q.e)}</p>`:''}</div>`}).join('');
  box.scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---------- 5. giáo viên ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function teacher(){
  const P=pend(),I=NET?NET.info():{src:'file'};
  const nb=bankSize(CH.map(c=>c[0]));
  const srcTxt=I.src==='sheet'?`Đang dùng câu hỏi <b>từ Google Sheet</b> (tải lúc ${dt(I.ts)})`:I.src==='cache'?`Đang dùng câu hỏi <b>từ Google Sheet</b> (bản lưu trên máy lúc ${dt(I.ts)})`:'Đang dùng câu hỏi <b>có sẵn trong file</b>';
  view(`<div class="exw narrow"><button class="exback" data-go="home">‹ Danh sách bài thi</button><div class="excard">
   <div class="exk">Dành cho giáo viên</div><h2>Google Sheet và ngân hàng câu hỏi</h2>
   <p>${LINK?`Link Web App đã cấu hình:<br><code class="exlinkv">${esc(LINK.replace(/(\/s\/.{6}).+(.{6}\/exec)$/,'$1…$2'))}</code>`:'<b class="c-bad">Chưa cấu hình.</b> Mở file HTML bằng Notepad, tìm dòng <code>linkGoogleSheet</code> ở đầu file và dán link Web App vào.'}</p>
   <p>${srcTxt}: <b>${nb}</b> câu trong ngân hàng thi, <b>${EXAMS.length}</b> đề thi.${I.err&&LINK?` <span class="c-bad">${esc(I.err)}.</span>`:''}</p>
   <div class="exbtns left"><button type="button" class="exbtn pri" data-go="ping"${LINK?'':' disabled'}>Kiểm tra kết nối</button>
    <button type="button" class="exbtn" data-go="reload"${LINK?'':' disabled'}>Tải lại câu hỏi từ Google Sheet</button>
    ${P.length?`<button type="button" class="exbtn" data-go="flush">Gửi lại ${P.length} bài chưa gửi</button>`:''}</div>
   <div class="exsend" hidden></div>
   <h3>Sửa, thêm câu hỏi và đề thi</h3>
   <ul class="exsteps">
    <li>Trang <b>NganHang</b>: mỗi dòng một câu. Chọn <b>Bài</b>, gõ câu hỏi, 2 – 4 đáp án, chọn <b>Đáp án đúng</b> (A, B, C, D), giải thích (nếu có).</li>
    <li>Cột <b>Dùng cho</b>: <i>Thi + Slide</i> = hiện ở phần trắc nghiệm cuối bài trên slide và có trong đề thi; <i>Chỉ thi</i>; <i>Chỉ slide</i>; <i>Tạm ẩn</i>. Để trống = chỉ dùng để thi.</li>
    <li>Thứ tự câu trên slide theo thứ tự dòng. Cột <b>Mã câu</b> để trống, bảng tính tự đánh mã. Có thể dán link ảnh Google Drive (chia sẻ “Bất kỳ ai có đường liên kết”) vào cột hình ảnh.</li>
    <li>Trang <b>DeThi</b>: mã đề, nhóm, tên, phạm vi (ví dụ <i>Bài 1, Bài 2</i> hoặc <i>Bài 10 - 14</i> hoặc <i>Tất cả</i>), số câu, số phút, cho xem đáp án, mở thi, mật khẩu. Trang <b>CauHinh</b>: danh sách lớp, lời nhắn cho học sinh.</li>
    <li>Sửa xong, menu <b>Thi MĐ18 → Kiểm tra lỗi ngân hàng</b> để xem câu nào thiếu đáp án. Học sinh mở lại trang là thấy câu hỏi mới.</li></ul>
   <h3>Cài đặt (làm một lần)</h3>
   <ol class="exsteps"><li>Tạo một Google Sheet mới (ví dụ <b>MĐ18 – Ngân hàng câu hỏi và kết quả thi</b>).</li>
    <li>Vào <b>Tiện ích mở rộng → Apps Script</b>, xóa mã mẫu, dán toàn bộ file <b>Code.gs</b>, bấm <b>Lưu</b>.</li>
    <li>Chọn hàm <b>caiDat</b> → <b>Chạy</b> → cấp quyền (Nâng cao → Đi tới dự án → Cho phép).</li>
    <li><b>Triển khai → Tùy chọn triển khai mới → Ứng dụng web</b>; Thực thi với tư cách: <b>Tôi</b>; Người có quyền truy cập: <b>Bất kỳ ai</b> → Triển khai.</li>
    <li>Dán <b>URL ứng dụng web</b> (đuôi <code>/exec</code>) vào <code>linkGoogleSheet</code> ở đầu file bài giảng và file thi, nhúng lại lên Google Sites.</li>
    <li>Mở trang này, bấm <b>Kiểm tra kết nối</b>, rồi bấm <b>Đưa ngân hàng câu hỏi lên Google Sheet</b> (chỉ làm một lần).</li></ol>
   <h3>Đề thi đang dùng</h3>
   <table class="extb"><tr><th>Mã</th><th>Bài thi</th><th>Câu</th><th>Phút</th><th>Đáp án</th><th>Mở</th></tr>
    ${EXAMS.map(e=>`<tr><td>${esc(e.id)}</td><td>${esc(e.ten)}</td><td>${Math.min(e.soCau,bankSize(e.ch))}</td><td>${String(e.phut).replace('.',',')}</td><td>${e.xem!==false?'Có':'Không'}</td><td>${e.mo===false?'Khóa':'Mở'}${e.pw?' · có mật khẩu':''}</td></tr>`).join('')}</table>
   <p class="exsmall">Số câu trong ngân hàng thi: ${CH.map(c=>esc(c[1]==='Chuyên đề'?'Inverter':c[1].replace('Bài ','B'))+': '+bankSize([c[0]])).join(' · ')}. Cột “Chi tiết bài làm” ở trang KetQua ghi theo mã câu: <code>b3-07:B+</code> là chọn B, đúng; <code>b3-07:A/C</code> là chọn A, đáp án đúng C; dấu <code>-</code> là bỏ trống.</p>
   </div></div>`,'close','gv');
  bodyEl.querySelector('[data-go=home]').onclick=home;
  const box=bodyEl.querySelector('.exsend');
  const show=(c,h)=>{box.hidden=false;box.className='exsend '+c;box.innerHTML=h};
  const pb=bodyEl.querySelector('[data-go=ping]');if(pb)pb.onclick=async()=>{show('wait','<i class="sp"></i>Đang kiểm tra…');
    try{const r=await jsonp({action:'ping'},20000);if(!r||!r.ok)throw 0;
      let h='✓ Kết nối tốt'+(r.sheet?': bảng tính “'+esc(r.sheet)+'”':'')+(r.rows!=null?', '+r.rows+' lượt thi đã nộp':'')+'.';
      if(r.bankRows!=null)h+=` Trang NganHang có <b>${r.bankRows}</b> câu, DeThi có <b>${r.examRows||0}</b> đề.`;
      if(r.bankRows===undefined)h+=' <span class="c-bad">Bảng tính đang dùng mã Code.gs cũ – hãy dán mã mới và triển khai phiên bản mới.</span>';
      show('ok',h);
      if(r.bankRows===0){const sb=document.createElement('div');sb.className='exbtns left';sb.innerHTML=`<button type="button" class="exbtn go">Đưa ngân hàng ${NET?NET.builtinRows().length:''} câu hỏi và ${DEF.length} đề thi lên Google Sheet</button>`;box.appendChild(sb);
        sb.querySelector('button').onclick=()=>seedFlow(show)}}
    catch(e){show('pd','Không kết nối được. Kiểm tra lại: link phải là URL ứng dụng web (đuôi /exec), quyền truy cập “Bất kỳ ai”, và đã triển khai phiên bản mới sau khi sửa mã.')}};
  const rb=bodyEl.querySelector('[data-go=reload]');if(rb)rb.onclick=async()=>{show('wait','<i class="sp"></i>Đang tải câu hỏi từ Google Sheet…');
    const ok=NET?await NET.load(true):false;if(screen!=='gv')return;teacher();const b2=bodyEl.querySelector('.exsend');b2.hidden=false;
    b2.className='exsend '+(ok?'ok':'pd');b2.innerHTML=ok?`✓ Đã tải ${NET.info().nExam} câu thi, ${NET.info().nSlide} câu trên slide từ Google Sheet.`:esc((NET&&NET.info().err)||'Không tải được')+'. Nếu bảng tính còn trống, bấm “Kiểm tra kết nối” để đưa ngân hàng câu hỏi lên.'};
  const fb=bodyEl.querySelector('[data-go=flush]');if(fb)fb.onclick=async()=>{fb.disabled=true;await flush();teacher()};
}
async function seedFlow(show){
  if(!NET)return;show('wait','<i class="sp"></i>Đang đưa ngân hàng câu hỏi lên Google Sheet… (khoảng 10 – 30 giây)');
  const cfgRows=[['Danh sách lớp',(Array.isArray(CFG.danhSachLop)?CFG.danhSachLop:[]).join(', ')],['Lời nhắn trên trang thi','']];
  await NET.seed(defRows(),cfgRows);
  for(let k=0;k<15;k++){await sleep(3000);
    try{const r=await jsonp({action:'ping'},15000);if(r&&r.bankRows>0){await NET.load(true);if(screen==='gv')teacher();
      const b=bodyEl.querySelector('.exsend');if(b){b.hidden=false;b.className='exsend ok';b.innerHTML=`✓ Đã đưa <b>${r.bankRows}</b> câu hỏi và <b>${r.examRows}</b> đề thi lên Google Sheet. Từ nay thầy/cô sửa câu hỏi ngay trên bảng tính.`}return}}catch(e){}}
  show('pd','Chưa thấy dữ liệu trên bảng tính. Thầy/cô mở Google Sheet kiểm tra trang NganHang, hoặc bấm “Kiểm tra kết nối” rồi thử lại.');
}

/* ---------- mở / đóng ---------- */
function open(id){
  mount();lastFocus=document.activeElement;root.hidden=false;opened=true;document.documentElement.classList.add('exam-open');
  const cur=S.get('exam_run',null),fx=findEx(id);
  if(cur&&!cur.done&&metaOf(cur)){st=cur;if(Date.now()>=st.t1)finish('timeout_away');else run()}
  else if(fx&&fx.mo!==false)reg(fx);else home();
  flush();
}
function close(){if(st&&!st.done)return;if(window.EXAM_STANDALONE){home();return}
  root.hidden=true;opened=false;document.documentElement.classList.remove('exam-open');try{lastFocus&&lastFocus.focus&&lastFocus.focus()}catch(e){}}
rebuild();
window.addEventListener('md18data',()=>{rebuild();if(!opened)return;if(screen==='home')home();else if(screen==='gv')teacher()});
window.Exam={open,close,isOpen:()=>opened,_bank:bank,_exams:()=>EXAMS,_cfg:CFG,_defRows:defRows};
if(window.EXAM_STANDALONE){const go=()=>open();if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go()}
else{/* bài thi còn dở hoặc kết quả chưa gửi: nhắc khi mở bài giảng */
  setTimeout(()=>{try{if(LINK&&pend().length)flush();const r=S.get('exam_run',null);if(r&&!r.done&&metaOf(r))open()}catch(e){}},600)}
})();
</script>
