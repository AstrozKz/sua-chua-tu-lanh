<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thi đánh giá – MĐ18 Sửa chữa, bảo trì tủ lạnh dân dụng</title>
<meta name="author" content="Huỳnh Hào Kiệt - Trường Trung cấp nghề Diên Khánh">
<meta name="theme-color" content="#0a1626">
<script>
/* ======================== CẤU HÌNH THI ĐÁNH GIÁ ========================
   Thầy/cô chỉ cần sửa trong khung này (mở file bằng Notepad, sửa, lưu lại).
   1) Dán link Web App của Google Apps Script vào giữa hai dấu ngoặc kép ở dòng linkGoogleSheet.
   2) Câu hỏi trắc nghiệm (trên slide và trong đề thi), danh sách đề thi, lớp... sửa trên Google Sheet
      (trang NganHang, DeThi, CauHinh). Các dòng còn lại bên dưới chỉ dùng khi chưa kết nối Google Sheet.  */
var CAU_HINH_THI = {
  linkGoogleSheet: "https://script.google.com/macros/s/AKfycbzWlT78EFJQeoMOvwDlarqvKriaQuEr_vCxuOXJBVouA8kElRBlLW2klY20VkYCGo1_sA/exec",   /* ví dụ: "https://script.google.com/macros/s/AKfy.../exec" */
  matKhau: "",               /* mật khẩu chung cho mọi bài thi ("" = không cần mật khẩu) */
  matKhauThiKetThuc: "",     /* mật khẩu riêng cho bài thi kết thúc mô đun */
  danhSachLop: [],           /* ví dụ: ["KTML K25A", "KTML K25B"]  (để trống = học sinh tự gõ lớp) */
  kiemTraBai:    { soCau: 10, phut: 15, xemDapAn: true  },   /* 15 đề kiểm tra cuối bài */
  kiemTraDinhKy: { soCau: 20, phut: 30, xemDapAn: true  },   /* 4 đề kiểm tra định kỳ */
  thiKetThuc:    { soCau: 40, phut: 60, xemDapAn: false },   /* thi kết thúc mô đun (lý thuyết) */
  dongDeThi: []              /* mã đề tạm khóa, ví dụ ["ktmd"] hoặc ["dk3","dk4"] */
};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#0c1a2c;color:#ECF4FB;font-family:'Be Vietnam Pro','Segoe UI',Roboto,Arial,sans-serif}
/* ================= THI ĐÁNH GIÁ (lớp phủ toàn màn hình, đơn vị px thật) ================= */
.exr{--x-bg:#0c1a2c;--x-pn:#132a46;--x-pn2:#183251;--x-ln:#2C4C72;--x-ln2:#3B6290;--x-tx:#ECF4FB;--x-mu:#A3B9CF;--x-fr:#72D8F6;--x-ok:#4FD8A0;--x-bad:#FF7A6E;--x-vo:#FFD84A;--x-co:#E39D60;
  position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;background:var(--x-bg);color:var(--x-tx);
  font-family:'Be Vietnam Pro','Segoe UI',Roboto,Arial,sans-serif;font-size:clamp(15px,.45vw + 12px,19px);line-height:1.5;-webkit-text-size-adjust:100%}
.exr[hidden],.exr [hidden]{display:none!important}
.exr .exr-body:focus,.exr .exr-body:focus-visible{outline:none}
.exr *{box-sizing:border-box}
.exr button{font:inherit;color:inherit;cursor:pointer}
.exr .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.exr :focus-visible{outline:3px solid var(--x-vo);outline-offset:2px}
.exr-top{flex:none;display:flex;align-items:center;gap:12px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top));background:#0a1626;border-bottom:1px solid var(--x-ln)}
.exr-brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.exr-logo{flex:none;width:38px;height:38px;border-radius:10px;background:var(--x-fr);color:#06223a;display:grid;place-items:center}
.exr-logo svg{width:22px;height:22px}
.exr-tt{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.exr-tt b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:1.25em;font-weight:700;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exr-tt small{font-size:.7em;color:var(--x-mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exr-tm{flex:none;display:flex;align-items:center;gap:6px;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:1.45em;padding:4px 12px;border-radius:12px;background:#10243c;border:1px solid var(--x-ln2);font-variant-numeric:tabular-nums}
.exr-tm svg{width:20px;height:20px}
.exr-tm.low{color:var(--x-vo);border-color:var(--x-vo)}
.exr-tm.crit{color:#fff;background:#b3261e;border-color:#ff8a80;animation:exblink 1s infinite}
@keyframes exblink{50%{opacity:.6}}
.exr-btn{flex:none;min-width:44px;height:44px;border-radius:12px;border:1px solid var(--x-ln2);background:#10243c;font-size:1.5em;line-height:1;padding:0 12px}
.exr-btn.go{font-size:1em;font-weight:700;background:var(--x-co);color:#2a1505;border-color:var(--x-co);padding:0 16px}
.exr-body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;outline:0}
.exr.running .exr-body{user-select:none;-webkit-user-select:none}
.exw{max-width:1100px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
.exw.narrow{max-width:760px}
.exhero h1{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:2.1em;line-height:1.05;margin:6px 0 6px;font-weight:700}
.exhero p{color:var(--x-mu);margin:0 0 14px}
.exw h2{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:1.5em;font-weight:700;margin:26px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.exw h2 small{font-family:'Be Vietnam Pro',sans-serif;font-size:.55em;font-weight:500;color:var(--x-mu)}
.exw h3{font-size:1.1em;margin:22px 0 8px}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.exc{position:relative;text-align:left;display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:16px;border:1px solid var(--x-ln);background:var(--x-pn);min-height:96px;transition:border-color .15s,background .15s,transform .1s}
.exc:hover{border-color:var(--x-fr);background:#183456}
.exc:active{transform:scale(.98)}
.exc-n{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:1.35em;color:var(--x-fr);line-height:1.1}
.exc-t{font-weight:600;line-height:1.3}
.exc-m{font-size:.85em;color:var(--x-mu);margin-top:auto;padding-top:4px}
.exc-b{position:absolute;right:12px;top:12px;font-size:.75em;font-weight:700;color:#06231a;background:var(--x-ok);border-radius:999px;padding:2px 9px}
.exc-b.lk{background:#3a4a5e;color:#d4dde8}
.exc.lock{opacity:.55;cursor:not-allowed}
.exgrid .exc[data-ex=ktmd]{border-color:var(--x-co);background:linear-gradient(160deg,#2b2a2a,#1c2a3c)}
.exgrid .exc[data-ex=ktmd] .exc-n{color:var(--x-co)}
.exresume{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;border-radius:16px;background:rgba(255,216,74,.1);border:1px solid rgba(255,216,74,.5);margin:6px 0 4px}
.exresume b{display:block}.exresume span{font-size:.88em;color:var(--x-mu)}
.exnote{padding:12px 14px;border-radius:12px;background:rgba(114,216,246,.08);border:1px solid rgba(114,216,246,.35);font-size:.92em;margin:8px 0}
.exnote.alert{background:rgba(255,122,110,.12);border-color:rgba(255,122,110,.55);font-weight:600}
.exhist{display:flex;flex-direction:column;gap:6px}
.exhist>div{display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 12px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--x-pn);font-size:.9em}
.exhist .d{color:var(--x-mu);font-size:.85em}
.exhist .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exhist b{font-family:'Barlow Condensed',sans-serif;font-size:1.3em;color:var(--x-vo)}
.exhist .s{font-size:.75em;font-weight:700;border-radius:999px;padding:2px 8px}
.exhist .s.ok{background:rgba(79,216,160,.18);color:var(--x-ok)}.exhist .s.pd{background:rgba(255,216,74,.15);color:var(--x-vo)}.exhist .s.lc{background:#25384f;color:var(--x-mu)}
.exfoot{margin-top:30px;padding-top:14px;border-top:1px solid var(--x-ln);display:flex;flex-direction:column;gap:6px;font-size:.8em;color:var(--x-mu)}
.exlink{background:none;border:0;padding:6px 0;color:var(--x-fr);text-decoration:underline;text-align:left;font-size:1em}
.exback{background:none;border:0;color:var(--x-fr);padding:6px 0 10px;font-weight:600}
.excard{background:var(--x-pn);border:1px solid var(--x-ln);border-radius:20px;padding:20px 18px}
.excard h2{margin:2px 0 10px;font-size:1.6em;line-height:1.15}
.exk{font-size:.8em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--x-co)}
.exmeta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.exmeta span{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:#0e2036;border:1px solid var(--x-ln);font-size:.88em;font-weight:600}
.exmeta span.sc{font-weight:500;color:var(--x-mu)}
.exmeta svg{width:18px;height:18px}
.exform{display:flex;flex-direction:column;gap:12px}
.exform label>span{display:block;font-weight:600;font-size:.92em;margin-bottom:4px}
.exform small{color:var(--x-mu);font-weight:400}
.exform input:not([type=checkbox]),.exform select{width:100%;font:inherit;font-size:max(16px,1em);padding:12px 14px;border-radius:12px;border:1px solid var(--x-ln2);background:#0b1828;color:#fff;min-height:50px}
.exform input:focus,.exform select:focus{border-color:var(--x-fr);outline:2px solid rgba(114,216,246,.35)}
.exform .chk{display:flex;gap:10px;align-items:flex-start;font-size:.92em;cursor:pointer}
.exform .chk input{width:24px;height:24px;flex:none;margin:1px 0 0;accent-color:var(--x-fr)}
.exform .chk span{font-weight:500;margin:0}
.exerr{color:var(--x-bad);font-weight:600;min-height:1.2em;font-size:.92em}
.exbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;border:1px solid var(--x-ln2);background:#1d3b5e;font-weight:600;text-align:center;transition:background .15s,transform .1s}
.exbtn:hover{background:#25486f}
.exbtn:active{transform:scale(.97)}
.exbtn.pri{background:var(--x-fr);border-color:var(--x-fr);color:#06223a}
.exbtn.pri:hover{background:#9ae4fa}
.exbtn.go{background:var(--x-co);border-color:var(--x-co);color:#2a1505}
.exbtn.xl{min-height:56px;font-size:1.1em;width:100%}
.exbtn.mini{min-height:38px;padding:6px 12px;font-size:.9em}
.exbtn[disabled]{opacity:.4;cursor:default;transform:none}
.exbtn svg{width:20px;height:20px}
.exrules{margin:18px 0 0;padding-left:20px;color:var(--x-mu);font-size:.9em}
.exrules li{margin-bottom:5px}
.exrules b{color:#fff}
.c-bad{color:var(--x-bad)}

/* --- làm bài --- */
.exrun{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:20px;padding:14px 14px calc(30px + env(safe-area-inset-bottom))}
.exq-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.exq-n{font-family:'Barlow Condensed',sans-serif;font-size:1.3em;color:var(--x-co);font-weight:600}
.exq-n b{font-size:1.4em;color:#fff}
.exflag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--x-ln2);background:transparent;border-radius:999px;padding:6px 12px;font-size:.85em;color:var(--x-mu);min-height:40px}
.exflag svg{width:18px;height:18px}
.exflag.on{background:rgba(255,216,74,.16);border-color:var(--x-vo);color:var(--x-vo)}
.exbar{height:6px;border-radius:4px;background:#1a3150;overflow:hidden;margin-bottom:16px}
.exbar i{display:block;height:100%;background:linear-gradient(90deg,var(--x-co),#f2c08f);transition:width .3s}
.exq-t{font-size:1.15em;font-weight:600;line-height:1.45;margin:0 0 16px;color:#fff}
.exops{display:flex;flex-direction:column;gap:10px}
.exop{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:58px;padding:10px 14px;border-radius:14px;border:2px solid var(--x-ln);background:#112640;line-height:1.35;transition:border-color .12s,background .12s}
.exop:hover{border-color:var(--x-ln2);background:#15304f}
.exop .L{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.25em;background:#0b1828;color:var(--x-fr);border:1px solid var(--x-ln)}
.exop.on{border-color:var(--x-fr);background:#17426a;box-shadow:0 0 0 3px rgba(114,216,246,.18)}
.exop.on .L{background:var(--x-fr);color:#06223a;border-color:var(--x-fr)}
.exnav{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-top:18px;position:sticky;bottom:0;padding:10px 0 calc(6px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--x-bg) 30%)}
.exnav .gr{padding:10px 12px;font-size:.88em;white-space:nowrap}
.exnav .sh{display:none}
.exnav .nx.last{background:var(--x-co);border-color:var(--x-co);color:#2a1505}
.exwho{font-size:.8em;color:var(--x-mu);margin:10px 0 0;text-align:center}
.exside{position:fixed;left:0;right:0;bottom:0;z-index:5;max-height:78vh;overflow:auto;background:#10233b;border-top:1px solid var(--x-ln2);border-radius:20px 20px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -20px 50px rgba(0,0,0,.5)}
.exr.side .exside{transform:none}
.exside-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.exside-x{width:40px;height:40px;border-radius:50%;border:1px solid var(--x-ln2);background:#0b1828;font-size:1.4em;line-height:1}
.exgridq{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}
.exgridq button{height:48px;border-radius:12px;border:1px solid var(--x-ln2);background:#0b1828;font-weight:700;position:relative}
.exgridq button.a{background:#1b5a45;border-color:var(--x-ok)}
.exgridq button.f::after{content:"";position:absolute;right:4px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--x-vo)}
.exgridq button.now{box-shadow:0 0 0 3px var(--x-fr)}
.exlegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8em;color:var(--x-mu);margin:12px 0}
.exlegend i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--x-ln2);background:#0b1828;vertical-align:-2px;margin-right:5px}
.exlegend i.a{background:#1b5a45;border-color:var(--x-ok)}
.exlegend i.f{background:var(--x-vo);border-radius:50%;border:0}
@media (min-width:960px){
  .exrun{grid-template-columns:1fr 300px;align-items:start;padding-top:22px}
  .exside{position:sticky;top:12px;transform:none;max-height:none;border:1px solid var(--x-ln);border-radius:18px;box-shadow:none;z-index:auto}
  .exside-x,.exnav .gr{display:none}
  .exnav{grid-template-columns:1fr 1fr}
  .exq-t{font-size:1.3em}
}
.exr-modal{position:absolute;inset:0;z-index:10;background:rgba(3,10,20,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.exr-modal[hidden]{display:none}
.exdlg{width:min(460px,100%);background:#163050;border:1px solid var(--x-ln2);border-radius:20px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:expop .18s ease}
.exdlg h3{margin:0 0 8px;font-size:1.3em}
.exdlg-b{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.exdlg-b .exbtn{flex:1}
@keyframes expop{from{transform:scale(.94);opacity:0}}
.exr-warn{position:absolute;left:12px;right:12px;top:calc(70px + env(safe-area-inset-top));z-index:9;max-width:620px;margin:0 auto;padding:12px 44px 12px 14px;border-radius:14px;background:#5c1d1a;border:1px solid #ff8a80;font-size:.92em;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.exr-warn[hidden]{display:none}
.exr-warn button{position:absolute;right:6px;top:6px;width:34px;height:34px;border:0;background:transparent;font-size:1.3em}

/* --- kết quả --- */
.exres{text-align:center}
.exscore{display:flex;flex-direction:column;align-items:center;margin:8px 0 12px}
.exscore b{font-family:'Barlow Condensed',sans-serif;font-size:4.6em;line-height:1;color:var(--x-vo)}
.exscore.fail b{color:var(--x-bad)}
.exscore span{color:var(--x-mu);font-weight:600}
.exscore em{font-style:normal;font-weight:700;margin-top:6px;padding:3px 12px;border-radius:999px;background:rgba(255,216,74,.14);color:var(--x-vo)}
.exscore.fail em{background:rgba(255,122,110,.15);color:var(--x-bad)}
.exstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.exstat div{background:#0e2036;border:1px solid var(--x-ln);border-radius:14px;padding:10px 6px}
.exstat b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:1.6em;line-height:1.1}
.exstat span{font-size:.78em;color:var(--x-mu);display:block;line-height:1.25}
.exwho2{font-size:.88em;color:var(--x-mu);margin:12px 0}
.exwho2 b{color:#fff}
.exsend{margin:12px 0;padding:12px 14px;border-radius:14px;font-size:.92em;text-align:left;display:block}
.exsend[hidden]{display:none}
.exsend.wait{background:#10243c;border:1px solid var(--x-ln2)}
.exsend.ok{background:rgba(79,216,160,.14);border:1px solid rgba(79,216,160,.5);color:#bff3dc;font-weight:600}
.exsend.pd{background:rgba(255,216,74,.1);border:1px solid rgba(255,216,74,.45)}
.exsend.lc{background:rgba(114,216,246,.08);border:1px solid rgba(114,216,246,.35)}
.exsend .exbtn{margin-top:8px}
.exsend .sp{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid var(--x-fr);border-right-color:transparent;animation:exspin .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes exspin{to{transform:rotate(360deg)}}
.exbtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.exbtns .exbtn{flex:1 1 200px}
.exbtns.left{justify-content:flex-start}
.exsmall{font-size:.82em;color:var(--x-mu)}
.exrev{margin-top:20px}
.exrev h3{font-size:1.3em}
.exrv{background:var(--x-pn);border:1px solid var(--x-ln);border-left:5px solid var(--x-ok);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.exrv.no{border-left-color:var(--x-bad)}
.exrv-h{display:flex;justify-content:space-between;font-size:.9em}
.exrv-h span{font-weight:700;color:var(--x-ok)}.exrv.no .exrv-h span{color:var(--x-bad)}
.exrv .q{font-weight:600;margin:4px 0 8px}
.exrv ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.exrv li{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:10px;font-size:.92em}
.exrv li .L{flex:none;font-weight:700;width:24px;color:var(--x-mu)}
.exrv li.r{background:rgba(79,216,160,.14);color:#cdf5e4}
.exrv li.w{background:rgba(255,122,110,.14);color:#ffd0ca}
.exrv li em{margin-left:auto;font-size:.8em;font-style:normal;color:var(--x-mu);white-space:nowrap}
.exrv .e{font-size:.88em;color:var(--x-mu);margin:8px 0 0}
.exsteps{padding-left:22px;margin:0}
.exsteps li{margin-bottom:6px}
.exr code{font-family:Consolas,monospace;font-size:.88em;background:#0b1828;border:1px solid var(--x-ln);border-radius:6px;padding:1px 6px;word-break:break-all}
.extb{width:100%;border-collapse:collapse;font-size:.9em}
.extb th,.extb td{border:1px solid var(--x-ln);padding:6px 8px;text-align:left}
.extb th{background:#1d3b5e}

<script>/* ================= Ngân hàng câu hỏi trắc nghiệm ================= */
window.QZ={};
QZ.b1=[
 {q:'Bốn thiết bị chính bắt buộc phải có trong hệ thống lạnh của tủ lạnh là:',o:['Máy nén, dàn ngưng, thiết bị tiết lưu, dàn bay hơi','Máy nén, quạt, thermostat, phin sấy lọc','Dàn ngưng, dàn bay hơi, timer, điện trở xả đá','Máy nén, rơ le khởi động, rơ le bảo vệ, tụ điện'],a:0,e:'Thiếu một trong bốn thiết bị máy nén – dàn ngưng – tiết lưu – dàn bay hơi thì chu trình lạnh không thực hiện được.'},
 {q:'Tủ lạnh làm lạnh thực phẩm nhờ quá trình nào của gas lạnh?',o:['Gas ngưng tụ trong dàn lạnh','Gas sôi (bay hơi) trong dàn lạnh và thu nhiệt','Gas bị nén trong máy nén','Gas đi qua phin sấy lọc'],a:1,e:'Chất lỏng bay hơi thì thu nhiệt. Gas lỏng áp thấp sôi trong dàn bay hơi, lấy nhiệt của không khí và thực phẩm trong tủ.'},
 {q:'Gas đi ra khỏi máy nén (đường đẩy) ở trạng thái:',o:['Lỏng, áp suất thấp','Hơi, áp suất thấp, lạnh','Hơi, áp suất cao, nhiệt độ cao','Lỏng, áp suất cao, nhiệt độ thấp'],a:2,e:'Máy nén nén hơi gas lên áp suất cao, nhiệt độ cao rồi đẩy sang dàn ngưng.'},
 {q:'Nhiệm vụ của ống mao (cáp) trong tủ lạnh là:',o:['Lọc cặn bẩn và hút ẩm','Giảm áp suất, nhiệt độ và khống chế lưu lượng gas vào dàn bay hơi','Thải nhiệt ra môi trường','Tách dầu ra khỏi gas'],a:1,e:'Ống mao là thiết bị tiết lưu: tiết lưu gas lỏng từ áp suất ngưng tụ xuống áp suất bay hơi.'},
 {q:'Phin sấy lọc được lắp ở vị trí nào?',o:['Giữa dàn bay hơi và máy nén','Giữa máy nén và dàn ngưng','Giữa dàn ngưng và ống mao','Trong ngăn đá'],a:2,e:'Phin sấy lọc lắp sau dàn ngưng, ngay trước ống mao để bảo vệ ống mao khỏi tắc bẩn, tắc ẩm.'},
 {q:'Đặc điểm nào đúng với tủ lạnh gián tiếp (quạt gió)?',o:['Dàn lạnh lộ trong ngăn đá, phải xả tuyết bằng tay','Dàn lạnh giấu sau vách, có quạt thổi gió lạnh và xả đá tự động','Không có thermostat','Không cần máy nén'],a:1,e:'Tủ gián tiếp dùng quạt đưa gió lạnh tới các ngăn, tuyết bám trên dàn được điện trở xả đá làm tan theo chu kỳ.'},
 {q:'Ở áp suất khí quyển, gas R134a sôi ở khoảng:',o:['+100 °C','0 °C','−26 °C','−80 °C'],a:2,e:'R134a sôi ở khoảng −26,3 °C; R600a khoảng −11,7 °C. Vì vậy không để gas lỏng phun vào da – gây bỏng lạnh.'},
 {q:'Vì sao ống mao thường được hàn áp sát vào ống hút?',o:['Để tiết kiệm ống','Để trao đổi nhiệt: lỏng trong ống mao lạnh thêm, ống hút không đọng sương','Để ống mao không bị rung','Để tăng áp suất hút'],a:1,e:'Ghép ống mao với ống hút tạo thành bộ trao đổi nhiệt hồi nhiệt, tăng năng suất lạnh và tránh đọng sương đường hút.'},
 {q:'Khi tủ chạy ổn định, vị trí nào nóng nhất?',o:['Ống hút về block','Dàn bay hơi','Ống đẩy gần đầu ra máy nén','Đầu ra ống mao'],a:2,e:'Hơi gas vừa được nén ở đầu đẩy có nhiệt độ cao nhất (có thể 60–90 °C).'},
 {q:'Khi máy nén dừng vài phút, áp suất phía cao áp và thấp áp:',o:['Giữ nguyên chênh lệch','Cân bằng nhau nhờ ống mao','Phía thấp áp tăng cao hơn phía cao áp','Đều giảm về chân không'],a:1,e:'Ống mao luôn thông nên gas tự chảy cho tới khi áp suất hai phía bằng nhau – giúp block khởi động lại nhẹ nhàng.'}
];
QZ.b2=[
 {q:'Trên nhãn tủ ghi "R600a – 45 g". Thông số này cho biết:',o:['Công suất máy nén 45 W','Loại gas và khối lượng gas nạp','Dung tích ngăn đông 45 lít','Nhiệt độ ngăn đông −45 °C'],a:1,e:'Đây là loại môi chất lạnh và lượng gas nạp chuẩn – căn cứ để nạp gas khi sửa chữa.'},
 {q:'Ngăn đông ký hiệu ★★★ có nhiệt độ:',o:['≤ −6 °C','≤ −12 °C','≤ −18 °C','0 đến 5 °C'],a:2,e:'★ ≤ −6 °C; ★★ ≤ −12 °C; ★★★ ≤ −18 °C; ★★★★ ≤ −18 °C và có khả năng cấp đông nhanh.'},
 {q:'Nhiệt độ thích hợp của ngăn mát tủ lạnh là:',o:['−18 °C','−6 đến −2 °C','0 đến 5 °C','10 đến 15 °C'],a:2,e:'Ngăn mát thường giữ 0 – 5 °C (tốt nhất khoảng 3 – 4 °C).'},
 {q:'Block chạy 15 phút, nghỉ 15 phút. Hệ số thời gian làm việc b bằng:',o:['0,25','0,5','1','2'],a:1,e:'b = 15 ÷ (15 + 15) = 0,5.'},
 {q:'Tủ lạnh đặt ở Việt Nam nên chọn cấp khí hậu:',o:['SN','N','ST hoặc T','Cấp nào cũng được'],a:2,e:'ST (16 – 38 °C) và T (16 – 43 °C) phù hợp khí hậu nóng.'},
 {q:'Block chạy gần như liên tục (b ≈ 1) có thể do:',o:['Núm thermostat để mức ấm nhất','Dàn nóng bẩn, ron cửa hở, thiếu gas','Tủ vừa xả đá xong','Phòng có điều hòa mát'],a:1,e:'Các nguyên nhân làm giảm khả năng làm lạnh hoặc tăng tải khiến block không đủ lạnh để ngắt.'},
 {q:'Block có công suất lạnh 120 W, COP = 1,5. Công suất điện tiêu thụ là:',o:['80 W','120 W','180 W','1,5 W'],a:0,e:'P = Q ÷ COP = 120 ÷ 1,5 = 80 W.'},
 {q:'Tủ có công suất 100 W, mỗi ngày block chạy 12 giờ. Điện năng tiêu thụ mỗi ngày:',o:['0,12 kWh','1,2 kWh','12 kWh','120 kWh'],a:1,e:'A = P × t = 0,1 kW × 12 h = 1,2 kWh.'},
 {q:'Khi đo dòng điện tủ lạnh bằng ampe kìm, phải:',o:['Kẹp cả 2 dây L và N','Kẹp 1 dây (L hoặc N)','Kẹp dây tiếp địa','Mắc ampe kìm nối tiếp'],a:1,e:'Kẹp cả 2 dây thì từ trường triệt tiêu, đồng hồ chỉ gần 0.'},
 {q:'Khi chọn block thay thế, cách làm đúng là:',o:['Chỉ cần cùng HP','Chọn block càng lớn càng tốt','Khớp loại gas, điện áp, công suất lạnh ở dải nhiệt độ làm việc, kiểu khởi động','Chọn theo kích thước vỏ'],a:2,e:'HP chỉ là giá trị danh định; phải tra datasheet để khớp các thông số chính.'}
];
QZ.b3=[
 {q:'Cuộn chạy (R) của động cơ block có đặc điểm:',o:['Dây nhỏ, nhiều vòng, điện trở lớn','Dây to, ít vòng, điện trở nhỏ','Chỉ làm việc lúc khởi động','Không nối với chân C'],a:1,e:'Cuộn chạy dây to, ít vòng nên điện trở nhỏ, làm việc liên tục.'},
 {q:'Đo 3 cặp chân block được: 1–2 = 30 Ω; 1–3 = 12 Ω; 2–3 = 18 Ω. Chân C là:',o:['Chân 1','Chân 2','Chân 3','Không xác định được'],a:2,e:'Cặp lớn nhất 1–2 (30 Ω) là R–S → chân còn lại (3) là C. Từ C: 3–1 = 12 Ω là R, 3–2 = 18 Ω là S.'},
 {q:'Đo 3 cặp chân block được: 1–2 = 30 Ω; 1–3 = 12 Ω; 2–3 = 18 Ω. Chân R (cuộn chạy) là:',o:['Chân 1','Chân 2','Chân 3','Chân 1 hoặc 2'],a:0,e:'Từ C (chân 3): giá trị nhỏ hơn (12 Ω, tới chân 1) là R.'},
 {q:'Hệ thức đúng giữa các điện trở của block còn tốt:',o:['R_RS = R_CR − R_CS','R_RS = R_CR + R_CS','R_CR = R_CS','R_CS = 0'],a:1,e:'Vì R–S là hai cuộn dây nối tiếp qua điểm chung C.'},
 {q:'Rơ le khởi động PTC ngắt cuộn đề nhờ:',o:['Lò xo','Lõi sắt rơi xuống','Điện trở PTC tăng rất lớn khi nóng lên','Tụ điện'],a:2,e:'PTC có hệ số nhiệt điện trở dương: nóng lên thì điện trở tăng mạnh, gần như ngắt cuộn đề.'},
 {q:'Rơ le khởi động kiểu dòng điện phải lắp:',o:['Chiều nào cũng được','Đúng chiều, vì tiếp điểm hoạt động nhờ trọng lực lõi sắt','Nằm ngang','Lộn ngược'],a:1,e:'Lõi sắt rơi xuống bằng trọng lực để mở tiếp điểm; lắp sai chiều cuộn đề sẽ không được ngắt.'},
 {q:'Cấp điện: block không chạy, tẹc-mít "tạch" khoảng 10 giây một lần; cuộn dây đo bình thường, rơ le khởi động tốt. Kết luận:',o:['Thiếu gas','Block kẹt cơ','Thermostat hỏng','Đèn hỏng'],a:1,e:'Đặc trưng của block kẹt cơ: dòng lớn kéo dài làm tẹc-mít nhảy liên tục.'},
 {q:'Dùng đèn thử nối tiếp, cặp chân làm đèn TỐI NHẤT là:',o:['C–R','C–S','R–S','Không xác định'],a:2,e:'R–S có điện trở lớn nhất nên dòng nhỏ nhất, đèn tối nhất.'},
 {q:'Rơ le bảo vệ (tẹc-mít) được mắc:',o:['Song song với block','Nối tiếp chân C, áp sát vỏ block','Nối tiếp cuộn đề','Giữa L và N'],a:1,e:'Nối tiếp chân C để chịu dòng toàn bộ động cơ, áp sát vỏ để cảm nhận nhiệt độ block.'},
 {q:'Đo chân block với vỏ thấy thông mạch. Block bị:',o:['Kẹt cơ','Chạm vỏ','Đứt cuộn đề','Bình thường'],a:1,e:'Cuộn dây chạm vỏ – nguy hiểm, phải thay block.'}
];
QZ.b4=[
 {q:'Đo điện trở cuộn dây mô tơ timer xả đá (giữa chân 3 và chân 1) còn tốt được khoảng:',o:['0 Ω','vài Ω','18 – 25 kΩ','∞'],a:2,e:'Cuộn dây mô tơ timer nhiều vòng dây rất nhỏ nên điện trở khoảng 18 – 25 kΩ; đo được ∞ là đứt cuộn dây.'},
 {q:'Chân 1 của timer xả đá nối tới:',o:['Dây L trước thermostat','Máy nén','Đầu ra của sò lạnh','Dây tiếp địa'],a:2,e:'Chân 1 nối tới đầu ra sò lạnh (điểm nối với cầu chì nhiệt). Nhờ vậy mô tơ timer có đường về N qua điện trở xả đá.'},
 {q:'Nút nhấn cửa 3 cực ở ngăn mát: khi đóng cửa (nút bị ấn) thì:',o:['COM – NC thông, đèn sáng','COM – NO thông, quạt chạy, đèn tắt','Cả đèn và quạt cùng chạy','Máy nén dừng'],a:1,e:'Nhả (cửa mở): COM – NC thông, đèn sáng, quạt dừng. Ấn (cửa đóng): COM – NO thông, quạt chạy, đèn tắt.'},
 {q:'Quạt dàn lạnh loại vòng chập tự khởi động được là nhờ:',o:['Tụ điện','Vòng đồng ngắn mạch ở cực từ làm lệch pha từ thông','Rơ le PTC','Board điều khiển'],a:1,e:'Vòng chập (shaded pole) tạo từ thông lệch pha, sinh từ trường quay yếu đủ để roto lồng sóc tự khởi động.'},
 {q:'Bộ phận cảm nhận nhiệt độ của rơ le bảo vệ (tẹc-mít) là:',o:['Viên gốm PTC','Đĩa lưỡng kim','Hộp xếp','Bầu cảm biến chứa gas'],a:1,e:'Lưỡng kim gồm 2 kim loại giãn nở khác nhau, nóng lên thì cong và mở tiếp điểm.'},
 {q:'Rơ le bảo vệ tốt khi đo ở nhiệt độ thường:',o:['Hở mạch','Thông mạch (gần 0 Ω)','Khoảng 300 Ω','Khoảng vài kΩ'],a:1,e:'Tiếp điểm thường đóng ở nhiệt độ thường.'},
 {q:'Thermostat đóng – ngắt máy nén dựa vào:',o:['Thời gian','Nhiệt độ dàn lạnh qua bầu cảm biến','Dòng điện block','Áp suất đẩy'],a:1,e:'Bầu cảm biến chứa môi chất giãn nở theo nhiệt độ, làm hộp xếp đóng/ngắt tiếp điểm.'},
 {q:'Đấu tắt 2 dây thermostat, cấp điện block chạy được. Kết luận:',o:['Block hỏng','Thermostat hỏng','Rơ le khởi động hỏng','Sò lạnh hỏng'],a:1,e:'Bỏ qua thermostat mà block chạy chứng tỏ tiếp điểm thermostat không đóng.'},
 {q:'Điện áp chịu đựng của tụ khởi động dùng ở lưới 220 V tối thiểu khoảng:',o:['110 V','220 V','330 V','50 V'],a:2,e:'Điện áp tụ ≥ 1,5 × 220 V ≈ 330 V (thường chọn 370 – 450 V).'},
 {q:'Theo sơ đồ timer xả đá dùng trong bài (chân 3 là chân chung sau thermostat), ở chế độ LÀM LẠNH tiếp điểm thông giữa:',o:['3 – 2','3 – 1','3 – 4','2 – 1'],a:2,e:'3 – 4 cấp điện cho máy nén (và quạt). Xả đá: 3 – 2 cấp điện tới sò lạnh. Mô tơ timer nối giữa chân 3 và chân 1, điện trở cuộn dây 18 – 25 kΩ.'},
 {q:'Sò lạnh (bimetal xả đá) ở nhiệt độ phòng đo thấy:',o:['Thông mạch','Hở mạch','Khoảng 2 kΩ','Khoảng 300 Ω'],a:1,e:'Sò lạnh chỉ đóng khi lạnh (khoảng −4 °C), mở khi ấm (khoảng +13 °C).'},
 {q:'Cầu chì nhiệt (sò nóng) có đặc điểm:',o:['Tự phục hồi khi nguội','Đứt khi quá nhiệt khoảng 70 – 76 °C, không tự phục hồi','Đóng khi lạnh','Mắc song song điện trở xả đá'],a:1,e:'Cầu chì nhiệt là bảo vệ cuối cùng, đứt thì phải thay (và thay luôn sò lạnh).'},
 {q:'Điện trở xả đá 150 W, 220 V có điện trở khoảng:',o:['1,5 Ω','32 Ω','323 Ω','3.230 Ω'],a:2,e:'R = U² ÷ P = 48.400 ÷ 150 ≈ 323 Ω.'},
 {q:'Trên sơ đồ tủ lạnh, ký hiệu "DEF. THERMO" là:',o:['Điện trở xả đá','Sò lạnh (rơ le nhiệt xả đá)','Cầu chì nhiệt','Thermostat ngăn mát'],a:1,e:'DEF. THERMO (defrost thermostat) – sò lạnh; DEF. HEATER là điện trở xả đá; TEMP. FUSE là cầu chì nhiệt.'}
];
QZ.b5=[
 {q:'Tủ gián tiếp dùng 2 nút nhấn cửa (3 cực ngăn mát, 2 cực ngăn đá). Mở cửa ngăn đá, cửa ngăn mát đóng thì:',o:['Quạt vẫn chạy','Quạt dừng, đèn ngăn mát tắt','Đèn ngăn mát sáng','Máy nén dừng'],a:1,e:'Nút 2 cực ngăn đá mắc nối tiếp trong nhánh quạt: mở cửa ngăn đá thì nút nhả, hở mạch, quạt dừng. Đèn chỉ sáng khi mở cửa ngăn mát.'},
 {q:'Ở chế độ xả đá, vì sao mô tơ timer đứng yên khi điện trở đang nóng?',o:['Cuộn dây mô tơ bị đứt','Chân 1 và chân 3 cùng điện thế (mô tơ bị nối tắt qua tiếp điểm 3–2 và sò lạnh đóng)','Thermostat mở','Cầu chì nhiệt đứt'],a:1,e:'Khi sò lạnh đóng, chân 3 → 2 → sò lạnh → điểm X → chân 1: hai đầu cuộn dây mô tơ cùng điện thế nên không có dòng qua mô tơ. Sò lạnh mở thì mô tơ chạy lại.'},
 {q:'Trong mạch tủ trực tiếp, đèn sáng khi mở cửa nhưng block không chạy. Điều này chứng tỏ:',o:['Mất nguồn vào tủ','Nguồn vào tủ có điện, cần kiểm tra nhánh block','Bóng đèn hỏng','Công tắc cửa hỏng'],a:1,e:'Nhánh đèn độc lập lấy điện từ nguồn – đèn sáng là nguồn còn.'},
 {q:'Ở mạch tủ gián tiếp, công tắc cửa thường điều khiển:',o:['Máy nén và điện trở','Đèn và quạt dàn lạnh','Timer','Thermostat'],a:1,e:'Mở cửa: đèn sáng, quạt dừng để gió lạnh không thổi ra ngoài.'},
 {q:'Khi timer chuyển sang xả đá, thiết bị nào dừng?',o:['Đèn','Block và quạt','Mô tơ timer','Điện trở xả đá'],a:1,e:'Timer chuyển tiếp điểm từ 3–4 (block, quạt) sang 3–2 (nhánh xả đá).'},
 {q:'Điện trở xả đá ngừng nóng trước khi hết thời gian xả đá của timer là nhờ:',o:['Thermostat','Sò lạnh mở khi dàn ấm lên','Cầu chì nhiệt đứt','Công tắc cửa'],a:1,e:'Sò lạnh mở ở khoảng +13 °C, ngắt điện trở khi đã tan hết tuyết.'},
 {q:'Kiểm tra nguội: đo 2 chân phích được 0 Ω. Em phải:',o:['Cấp điện thử','Không cấp điện, tìm chỗ chập mạch','Thay cầu chì','Bình thường'],a:1,e:'0 Ω giữa L và N là chập mạch – cấp điện sẽ nhảy CB, cháy thiết bị.'},
 {q:'Ở nhiệt độ phòng, vặn timer sang xả đá rồi đo 2 chân phích không thấy điện trở xả đá vì:',o:['Điện trở đứt','Sò lạnh đang hở mạch','Timer hỏng','Thermostat hở'],a:1,e:'Sò lạnh chỉ đóng khi lạnh; muốn kiểm tra nhánh xả đá ở nhiệt độ phòng phải nối tắt tạm sò lạnh.'},
 {q:'Điện áp nguồn cho phép đối với tủ 220 V khoảng:',o:['150 – 180 V','198 – 242 V','250 – 280 V','110 – 130 V'],a:1,e:'220 V ± 10% tức khoảng 198 – 242 V.'},
 {q:'Tủ điện tử dùng gì thay cho thermostat cơ và sò lạnh?',o:['Cầu chì','Cảm biến nhiệt độ NTC đọc bởi board','Tụ điện','Rơ le dòng'],a:1,e:'Board đọc cảm biến (R-sensor, F-sensor, D-sensor) để điều khiển block, xả đá, quạt.'},
 {q:'Lắp mạch xong cấp điện thì block ù ù không chạy, tẹc-mít nhảy. Nguyên nhân hay gặp:',o:['Đấu nhầm chân R và S hoặc rơ le sai loại','Đèn hỏng','Công tắc cửa hỏng','Dây tiếp địa chưa nối'],a:0,e:'Nhầm R – S làm cuộn đề nhận điện liên tục hoặc block không đủ mômen khởi động.'},
 {q:'Nhánh xả đá trong tủ gián tiếp gồm (nối tiếp):',o:['Thermostat – quạt – đèn','Sò lạnh – điện trở xả đá – cầu chì nhiệt','PTC – block – OLP','Công tắc cửa – đèn'],a:1,e:'Từ chân 2 timer qua sò lạnh, điện trở xả đá, cầu chì nhiệt về N.'}
];
QZ.inv=[
 {q:'Tủ lạnh Inverter tiết kiệm điện chủ yếu nhờ:',o:['Dùng gas đặc biệt','Thay đổi tốc độ máy nén theo nhu cầu lạnh thay vì bật – tắt','Không có xả đá','Dàn nóng lớn hơn'],a:1,e:'Block chạy liên tục ở tốc độ thấp khi đủ lạnh, tránh dòng khởi động lớn và tổn hao đóng ngắt.'},
 {q:'Block tủ Inverter có 3 chân ký hiệu:',o:['C – R – S','C – M – A','U – V – W','L – N – E'],a:2,e:'Ba cuộn dây giống nhau nên ký hiệu U – V – W, điện trở 3 cặp chân bằng nhau.'},
 {q:'Đo 3 cặp chân block Inverter còn tốt thấy:',o:['Một cặp lớn gấp đôi','Ba cặp bằng nhau','Ba cặp đều ∞','Một cặp bằng 0'],a:1,e:'Stato 3 pha đối xứng nên điện trở các cặp bằng nhau (vài Ω).'},
 {q:'Khối tạo ra điện áp 3 pha tần số thay đổi cấp cho block là:',o:['Khối chỉnh lưu','Khối công suất IPM','Nguồn xung 12 V','Cảm biến'],a:1,e:'IPM gồm 6 transistor công suất đóng cắt điện áp DC theo xung PWM.'},
 {q:'Sau khi rút phích tủ Inverter, nguy hiểm còn lại trên board là:',o:['Không còn gì','Tụ lọc DC còn tích điện áp cao (khoảng 310 V)','Dàn lạnh còn lạnh','Quạt còn quay'],a:1,e:'Phải chờ tụ xả và đo điện áp tụ trước khi chạm vào board.'},
 {q:'Muốn thử block Inverter còn chạy không, cách làm SAI là:',o:['Đo điện trở 3 cuộn dây','Đo cách điện với vỏ','Cấp trực tiếp 220 V vào 2 chân block','Chạy qua board theo hướng dẫn hãng'],a:2,e:'Block BLDC không chạy bằng điện xoay chiều lưới; cấp trực tiếp sẽ làm hỏng block.'},
 {q:'Máy nén Linear khác máy nén piston thường ở chỗ:',o:['Không có piston','Piston chuyển động thẳng nhờ động cơ tuyến tính, không có trục khuỷu','Dùng 2 block','Chạy bằng dầu'],a:1,e:'Bỏ cơ cấu trục khuỷu – tay biên nên giảm ma sát, êm và tiết kiệm.'},
 {q:'Tủ Inverter bị rò điện nhẹ ra vỏ, cách xử lý đúng:',o:['Bỏ qua','Nối đất (tiếp địa) cho vỏ tủ chắc chắn','Đảo dây L – N là đủ','Thay block'],a:1,e:'Mạch lọc nhiễu của biến tần gây dòng rò nhỏ; nối đất bảo vệ người sử dụng.'}
];
QZ.b6=[
 {q:'"Cân cáp" là công việc:',o:['Cân khối lượng gas nạp','Xác định trở lực, chiều dài ống mao phù hợp với block và loại tủ','Kiểm tra cách điện block','Đo dòng điện block'],a:1,e:'Ống mao (cáp) phải phù hợp block, loại gas và nhiệt độ yêu cầu.'},
 {q:'Cùng đường kính, ống mao dài hơn thì:',o:['Trở lực nhỏ hơn','Trở lực lớn hơn, áp suất cân cáp cao hơn','Không thay đổi','Gas chảy nhiều hơn'],a:1,e:'Ống mao càng dài, càng nhỏ thì trở lực càng lớn.'},
 {q:'Khi cân cáp hở, đồng hồ được gắn ở:',o:['Ống hút block','Đường đẩy, trước phin lọc','Đầu ra ống mao','Dàn bay hơi'],a:1,e:'Đồng hồ cao áp gắn giữa đầu đẩy block và phin, đo áp suất khi đầu ống mao xả ra không khí.'},
 {q:'Cân cáp hở tủ 2 cửa có quạt R134a, giá trị tham khảo là:',o:['60 – 80 psi','120 – 160 psi','180 – 210 psi','400 – 450 psi'],a:2,e:'Theo bảng sổ tay: tủ 2 cửa có quạt (≤ −18 °C) R134a cân 180 – 210 psi.'},
 {q:'Cân cáp được áp suất cao hơn yêu cầu, em xử lý:',o:['Nối thêm ống mao','Cắt bớt ống mao từng đoạn ngắn rồi đo lại','Thay block','Nạp thêm gas'],a:1,e:'Áp cao do ống mao dài – cắt bớt dần.'},
 {q:'Cân cáp được áp suất thấp hơn nhiều so với yêu cầu:',o:['Cắt bớt ống mao','Ống mao quá ngắn hoặc quá to – thay đoạn ống mao mới phù hợp','Đạt yêu cầu','Tăng điện áp'],a:1,e:'Không nối dài ống mao được, phải thay đoạn mới.'},
 {q:'Vì sao hàn xong ống mao nên cân lại?',o:['Để làm nguội mối hàn','Kiểm tra mối hàn không làm nghẹt ống mao','Để nạp gas','Không cần thiết'],a:1,e:'Que hàn chảy vào hoặc bóp méo ống làm tăng trở lực đột ngột.'},
 {q:'Ưu điểm của cân cáp kín so với cân cáp hở:',o:['Nhanh, không tốn gas','Chính xác, sát điều kiện làm việc thật','Không cần dụng cụ','Không cần chạy block'],a:1,e:'Cân kín dùng gas thật trong hệ thống kín nên chính xác hơn nhưng tốn thời gian và gas.'}
];
QZ.b7=[
 {q:'Gas R600a có đặc điểm cần lưu ý nhất khi sửa chữa là:',o:['Độc, gây ngộ độc','Dễ cháy','Phá hủy tầng ôzôn mạnh','Áp suất rất cao'],a:1,e:'R600a (isobutan) là hydrocarbon dễ cháy – nạp, xả nơi thoáng, tránh xa lửa.'},
 {q:'Thử kín hệ thống tủ lạnh nên dùng:',o:['Oxy','Khí nén máy bơm hơi','Nitơ qua van giảm áp','Gas R600a'],a:2,e:'Nitơ khô, trơ. Oxy gây nổ khi gặp dầu; khí nén có hơi ẩm.'},
 {q:'Áp suất thử kín tối đa cho dàn lạnh tủ dùng R600a khoảng:',o:['30 psi','100 – 120 psi','300 psi','500 psi'],a:1,e:'Dàn nhôm mỏng – R600a thử khoảng 100 – 120 psi, R134a khoảng 150 psi.'},
 {q:'Mục đích chính của hút chân không là:',o:['Làm lạnh hệ thống','Loại bỏ không khí và hơi ẩm khỏi hệ thống','Kiểm tra block','Tăng áp suất'],a:1,e:'Ẩm gây tắc ẩm, axit, cháy block; không khí làm tăng áp suất ngưng tụ.'},
 {q:'Hút chân không đạt yêu cầu khi kim đồng hồ xanh chỉ:',o:['0 psi','−30 inHg (−76 cmHg) và đứng yên khi giữ','150 psi','−10 inHg'],a:1,e:'Đạt −30 inHg, hút thêm ít nhất 30 phút, khóa van giữ 5 – 10 phút kim không tăng.'},
 {q:'Kết thúc hút chân không, thứ tự đúng là:',o:['Tắt bơm rồi khóa van','Khóa van xanh rồi tắt bơm','Tháo dây rồi tắt bơm','Mở van đỏ rồi tắt bơm'],a:1,e:'Khóa van trước để không khí, dầu bơm không bị hút ngược vào hệ thống.'},
 {q:'Mở van xanh trên bộ đồng hồ nạp gas thì:',o:['Vị trí 1 (giữa) thông với 3 (đỏ)','Vị trí 1 (giữa) thông với 2 (xanh)','Cả 3 vị trí cô lập','Đồng hồ đỏ chỉ 0'],a:1,e:'Van xanh (thấp áp) nối dây vàng giữa với dây xanh.'},
 {q:'"Xả khí dây vàng" khi nối chai gas nhằm:',o:['Thử xì chai gas','Đuổi không khí trong dây nạp ra ngoài','Giảm áp suất chai','Làm lạnh dây'],a:1,e:'Nới đầu dây vàng ở bộ đồng hồ 1 – 2 giây cho gas đẩy không khí ra trước khi nạp.'},
 {q:'Dấu hiệu nạp THỪA gas:',o:['Tuyết bám một đoạn đầu dàn','Ống hút đóng tuyết tới block, dòng cao','Áp hút thấp','Dàn nóng nguội'],a:1,e:'Thừa gas: lỏng tràn ra ống hút, áp suất và dòng tăng – phải xả bớt.'},
 {q:'Cách nạp gas chính xác nhất cho tủ R600a là:',o:['Nạp theo tiếng kêu block','Nạp theo khối lượng ghi trên nhãn bằng cân điện tử','Nạp đến khi đồng hồ chỉ 50 psi','Nạp đầy chai nhỏ'],a:1,e:'Lượng nạp R600a rất nhỏ, sai vài gam ảnh hưởng lớn – cân điện tử là chuẩn.'}
];
QZ.b8=[
 {q:'Tủ trực tiếp: block chạy liên tục, tuyết chỉ bám một đoạn ngắn đầu dàn, áp hút thấp. Nguyên nhân thường gặp:',o:['Thừa gas','Thiếu gas (xì) hoặc nghẹt ống mao','Hỏng đèn','Hỏng công tắc cửa'],a:1,e:'Ít gas vào dàn: thiếu gas hoặc nghẹt một phần – phân biệt bằng vết dầu, cân cáp.'},
 {q:'Dấu hiệu đặc trưng của tắc ẩm:',o:['Không bao giờ lạnh','Lạnh rồi mất lạnh theo chu kỳ, chườm nóng đầu ống mao gas chảy lại','Block kêu to','Đèn không sáng'],a:1,e:'Nước đóng băng tại đầu ra ống mao gây tắc; tan ra thì gas chảy lại.'},
 {q:'Tủ quạt: dàn lạnh đóng băng thành khối. Linh kiện nên kiểm tra đầu tiên:',o:['Block','Sò lạnh và hệ thống xả đá','Bóng đèn','Ron cửa'],a:1,e:'Sò lạnh là linh kiện xả đá hay hỏng nhất; kiểm tra thêm cầu chì nhiệt, điện trở, timer.'},
 {q:'Đấu tắt 2 dây thermostat, block chạy. Cần thay:',o:['Block','Thermostat','Tẹc-mít','Phin lọc'],a:1,e:'Thermostat không đóng tiếp điểm.'},
 {q:'Cấp điện, block không chạy, tẹc-mít tạch khoảng 10 giây một lần; rơ le khởi động, cuộn dây tốt. Kết luận:',o:['Thiếu gas','Block kẹt cơ','Timer kẹt','Điện trở xả đá đứt'],a:1,e:'Dòng lớn kéo dài do roto kẹt làm tẹc-mít nhảy liên tục → thay block.'},
 {q:'Xử lý tắc ẩm, KHÔNG được làm:',o:['Thay phin mới','Thổi Nitơ','Dùng block hoặc máy nén khí thổi hệ thống','Hút chân không lâu'],a:2,e:'Khí do block, máy nén khí thổi vào có hơi ẩm – làm hệ thống ẩm thêm.'},
 {q:'Dàn nóng âm vách bị xì, cách xử lý phù hợp:',o:['Hàn bên trong vỏ tủ','Cô lập dàn cũ, lắp dàn nóng mới ngoài mặt sau tủ','Nạp gas thường xuyên','Bỏ dàn nóng'],a:1,e:'Dàn âm không tiếp cận được để hàn – thay bằng dàn lắp ngoài.'},
 {q:'Ngăn mát đóng đá, rau hỏng. Việc đầu tiên nên làm:',o:['Thay block','Chỉnh lại cửa gió (giảm gió lạnh xuống ngăn mát)','Nạp thêm gas','Thay quạt'],a:1,e:'Cửa gió sai là nguyên nhân thường gặp; vẫn bị thì kiểm tra thermostat.'},
 {q:'Tủ rò điện ra vỏ. Việc KHÔNG đúng:',o:['Đo cách điện block với vỏ','Kiểm tra dây bị chuột cắn','Bỏ dây tiếp địa cho hết rò','Nối đất vỏ tủ'],a:2,e:'Tiếp địa là bảo vệ người dùng – không bao giờ bỏ.'},
 {q:'Khi thay block cháy (dầu đen, mùi khét), ngoài block mới cần:',o:['Không cần gì thêm','Xúc rửa hệ thống, thay phin (có thể dùng phin chống axit)','Chỉ nạp thêm gas','Thay đèn'],a:1,e:'Axit, cặn cháy còn trong hệ thống sẽ làm hỏng block mới.'}
];
QZ.b9=[
 {q:'Khoảng cách từ mặt sau tủ lạnh tới tường nên:',o:['Sát tường','Khoảng 10 cm trở lên (theo hướng dẫn hãng)','1 m','Không quan trọng'],a:1,e:'Để dàn nóng thải nhiệt tốt, giảm điện năng.'},
 {q:'Sau khi vận chuyển tủ nằm nghiêng, nên:',o:['Cắm điện ngay','Để tủ đứng yên vài giờ rồi mới cắm điện','Nạp thêm gas','Tháo block'],a:1,e:'Dầu cần thời gian chảy về block, tránh block hút dầu, hỏng clapê.'},
 {q:'Núm thermostat đặt mức lạnh nhất thường xuyên sẽ:',o:['Tiết kiệm điện','Block chạy gần như liên tục, hao điện, ngăn mát có thể đóng đá','Tủ kém lạnh','Không ảnh hưởng'],a:1,e:'Chỉ tăng mức khi cần (mùa nóng, nhiều thực phẩm).'},
 {q:'Thực phẩm nào nên để ở ngăn đông?',o:['Rau xanh','Trứng','Thịt cá cần trữ lâu ngày','Sữa tươi'],a:2,e:'Ngăn đông ≤ −18 °C giữ thịt cá lâu; rau, trứng, sữa để ngăn mát.'},
 {q:'Phá tuyết tủ trực tiếp khi lớp tuyết dày khoảng:',o:['1 mm','5 mm','5 cm','Không bao giờ'],a:1,e:'Tuyết dày cách nhiệt, làm tủ kém lạnh và hao điện.'},
 {q:'Khi phá tuyết, việc tuyệt đối không làm:',o:['Rút phích điện','Dùng dao, vật nhọn cạy tuyết','Đặt chậu nước ấm vào ngăn đá','Lau khô dàn'],a:1,e:'Vật nhọn làm thủng dàn nhôm – phải thay dàn, nạp gas.'},
 {q:'Kiểm tra ron cửa kín bằng cách:',o:['Kẹp tờ giấy, rút ra phải có lực','Đổ nước vào cửa','Đo điện trở ron','Nghe tiếng block'],a:0,e:'Tờ giấy rút ra dễ dàng là ron hở, chai.'},
 {q:'Khi bảo dưỡng, KHÔNG được:',o:['Rút phích trước khi vệ sinh','Xịt nước trực tiếp vào block, rơ le, board','Vệ sinh dàn nóng bằng chổi mềm','Thông ống thoát nước'],a:1,e:'Nước vào thiết bị điện gây chạm chập, giật điện.'},
 {q:'Thức ăn nóng vừa nấu xong nên:',o:['Cho ngay vào ngăn đông','Để nguội rồi đậy kín cho vào ngăn mát','Để ở cánh cửa','Để hở nắp'],a:1,e:'Đồ nóng làm tủ chạy nhiều, tăng tuyết bám, ảnh hưởng thực phẩm khác.'},
 {q:'Vệ sinh dàn nóng tủ lạnh nên thực hiện khoảng:',o:['Mỗi ngày','6 – 12 tháng một lần','10 năm một lần','Không cần'],a:1,e:'Dàn nóng bám bụi làm áp suất ngưng tăng, kém lạnh, hao điện.'}
];
QZ.b10=[
 {q:'Theo chương trình, máy lạnh thương nghiệp được chia thành mấy nhóm chính?',o:['2','3','4','5'],a:1,e:'(1) Tủ lạnh, thùng lạnh, tủ đông, tủ kết đông; (2) tủ – quầy kính lạnh, đông; (3) tủ – quầy lạnh, đông hở.'},
 {q:'Tủ, quầy lạnh hở giữ lạnh cho hàng hóa nhờ:',o:['Cửa kính 3 lớp','Màn gió lạnh thổi trước các kệ','Nắp đặc','Điện trở sưởi'],a:1,e:'Màn gió (air curtain) ngăn không khí nóng của siêu thị tràn vào khoang lạnh.'},
 {q:'Tủ kết đông có đặc điểm:',o:['Nhiệt độ +5 °C','Nhiệt độ rất thấp (−30 đến −40 °C), quạt thổi mạnh để làm đông nhanh','Không có máy nén','Chỉ dùng trưng bày'],a:1,e:'Làm đông nhanh giữ chất lượng thực phẩm (tinh thể đá nhỏ).'},
 {q:'Thiết bị giữ lỏng chưa bay hơi, không cho về máy nén là:',o:['Bình chứa cao áp','Bình tách lỏng','Phin sấy lọc','Mắt gas'],a:1,e:'Bình tách lỏng đặt trên đường hút, chống va đập thủy lực cho máy nén.'},
 {q:'Bầu cảm biến của van tiết lưu nhiệt được kẹp ở:',o:['Đầu vào dàn ngưng','Ống hút ngay sau dàn bay hơi','Bình chứa cao áp','Ống đẩy'],a:1,e:'Bầu cảm nhận nhiệt độ hơi cuối dàn để điều chỉnh độ quá nhiệt.'},
 {q:'Dàn bay hơi thiếu lỏng (độ quá nhiệt tăng), van tiết lưu nhiệt sẽ:',o:['Đóng lại','Mở thêm','Giữ nguyên','Ngắt máy nén'],a:1,e:'Bầu nóng lên → áp suất bầu tăng → đẩy màng mở van thêm.'},
 {q:'Mắt gas có nhiều bọt khi máy chạy ổn định thường do:',o:['Thừa gas','Thiếu gas hoặc tắc trước mắt gas','Dàn ngưng sạch','Quạt dàn lạnh chạy'],a:1,e:'Bọt là hơi lẫn trong đường lỏng – thiếu gas hoặc tụt áp qua phin tắc.'},
 {q:'Tủ mát cửa kính thường xả đá bằng cách:',o:['Điện trở công suất lớn','Xả đá tự nhiên khi máy dừng, quạt vẫn thổi','Dùng nước nóng','Không cần xả đá'],a:1,e:'Nhiệt độ dàn tủ mát gần 0 °C nên tuyết tan khi máy nghỉ; tủ kính đông mới cần điện trở.'}
];
QZ.b11=[
 {q:'Công tắc "cấp đông nhanh" trên tủ đông có tác dụng:',o:['Ngắt máy nén','Nối tắt thermostat để máy nén chạy liên tục','Bật đèn','Xả đá'],a:1,e:'Dùng khi cần làm đông nhanh; phải tắt sau đó để tránh chạy liên tục mãi.'},
 {q:'Trong mạch có contactor, máy nén chạy khi:',o:['Cuộn hút contactor có điện, tiếp điểm chính đóng','Rơ le nhiệt tác động','Rơ le áp suất cao ngắt','CB tắt'],a:0,e:'Mạch điều khiển cấp điện cho cuộn K, tiếp điểm chính K cấp điện động lực cho máy nén.'},
 {q:'Rơ le áp suất cao, áp suất thấp và tiếp điểm rơ le nhiệt được mắc:',o:['Song song với máy nén','Nối tiếp trong mạch điều khiển cuộn contactor','Nối tiếp quạt','Song song cuộn K'],a:1,e:'Bất kỳ bảo vệ nào tác động cũng ngắt cuộn K, dừng máy nén.'},
 {q:'Ngõ ra "DEF" của bộ điều khiển nhiệt độ điều khiển:',o:['Máy nén','Điện trở xả đá','Quạt dàn ngưng','Đèn'],a:1,e:'COMP – máy nén; DEF – xả đá; FAN – quạt dàn lạnh.'},
 {q:'Bộ điều khiển có "trễ bảo vệ máy nén" khoảng 3 phút nhằm:',o:['Tiết kiệm điện','Cho áp suất cân bằng, tránh khởi động liên tục làm hỏng máy','Làm lạnh nhanh','Xả đá'],a:1,e:'Máy nén khởi động khi áp suất chưa cân bằng dễ quá tải, nhảy bảo vệ.'},
 {q:'Thiết bị 1 pha công suất 660 W, 220 V, cos φ = 1. Dòng điện làm việc là:',o:['0,3 A','3 A','30 A','6,6 A'],a:1,e:'I = P ÷ (U·cos φ) = 660 ÷ 220 = 3 A.'},
 {q:'Theo công thức sổ tay, dòng dùng để chọn CB bằng khoảng:',o:['0,5 × I','1,5 × I','3 × I','10 × I'],a:1,e:'Icb ≈ 1,5 × I, rồi chọn cỡ CB tiêu chuẩn gần nhất phía trên.'},
 {q:'Bộ điều khiển sáng, máy nén không chạy, đo thấy rơ le áp suất cao đang hở. Nên kiểm tra:',o:['Bóng đèn','Dàn ngưng bẩn, quạt dàn ngưng, thừa gas','Cảm biến S1','Công tắc cửa'],a:1,e:'HP ngắt do áp suất ngưng tụ cao.'}
];
QZ.b12=[
 {q:'Bản vẽ thể hiện vị trí tủ, quầy, cụm máy, tuyến ống là:',o:['Bản vẽ mặt bằng lắp đặt','Bản vẽ chi tiết block','Sơ đồ điện','Bản vẽ kết cấu'],a:0,e:'Mặt bằng lắp đặt cho biết vị trí, kích thước, tuyến ống, máng điện.'},
 {q:'Vị trí đặt cụm máy nén – ngưng tụ phải:',o:['Kín gió','Thoáng, có mái che, không bị gió nóng quẩn lại, dễ bảo trì','Sát nguồn nhiệt','Trong kho lạnh'],a:1,e:'Giải nhiệt tốt thì áp suất ngưng thấp, máy bền, tiết kiệm điện.'},
 {q:'Khi hàn ống đồng hệ thống lạnh nên:',o:['Thổi oxy bên trong','Thổi Nitơ nhẹ bên trong ống','Đổ nước vào ống','Hàn khi còn gas'],a:1,e:'Nitơ đẩy oxy ra, tránh tạo muội đồng làm tắc phin, van.'},
 {q:'Ống thoát nước ngưng dài 5 m, độ dốc tối thiểu 1% thì chênh lệch độ cao ít nhất:',o:['0,5 cm','5 cm','50 cm','5 m'],a:1,e:'1% của 500 cm là 5 cm.'},
 {q:'Bẫy dầu được làm trên đoạn:',o:['Ống lỏng nằm ngang','Ống hút đi lên (ống đứng)','Ống nước','Dây điện'],a:1,e:'Giúp dầu hồi về máy nén khi ống hút đi lên cao (khoảng 3 – 5 m một bẫy).'},
 {q:'Gas hỗn hợp như R404A phải nạp:',o:['Ở thể hơi','Ở thể lỏng (dốc ngược bình)','Bằng Nitơ','Không cần cân'],a:1,e:'Nạp hơi làm thay đổi thành phần hỗn hợp.'},
 {q:'Thứ tự đúng sau khi lắp ống và điện xong:',o:['Nạp gas → thử kín → hút chân không','Vệ sinh → thử kín → hút chân không → nạp gas → chạy thử','Chạy thử → nạp gas','Hút chân không → thử kín'],a:1,e:'Đúng 10 bước của quy trình lắp đặt trong chương trình.'},
 {q:'Ống nào phải bọc cách nhiệt kỹ nhất?',o:['Ống đẩy','Ống hút (đường về máy nén)','Dây điện','Ống nước cấp'],a:1,e:'Ống hút lạnh: không bọc sẽ đọng sương, tổn thất lạnh, hơi về máy nén quá nóng.'}
];
QZ.b13=[
 {q:'Áp suất hút thấp, áp suất đẩy thấp, dòng thấp, mắt gas có bọt. Hệ thống bị:',o:['Thừa gas','Thiếu gas','Dàn ngưng bẩn','Máy nén kẹt'],a:1,e:'Ba thông số cùng thấp kèm bọt ở mắt gas là dấu hiệu thiếu gas.'},
 {q:'Áp suất đẩy rất cao, dòng cao, rơ le HP ngắt. Kiểm tra trước tiên:',o:['Dàn ngưng, quạt dàn ngưng','Đèn tủ','Cảm biến xả đá','Ron cửa'],a:0,e:'Giải nhiệt kém làm áp suất ngưng tụ tăng cao.'},
 {q:'Áp suất hút cao, áp suất đẩy thấp, dòng thấp, lạnh rất kém. Nghi ngờ:',o:['Thiếu gas','Máy nén yếu (hỏng clapê)','Tắc phin','Thừa gas'],a:1,e:'Máy nén không tạo được chênh lệch áp suất.'},
 {q:'Phin lọc lạnh buốt, đọng sương ở đầu ra; áp suất hút xuống chân không. Hư hỏng là:',o:['Tắc phin lọc','Thừa gas','Quạt dàn ngưng hỏng','Rơ le nhiệt hỏng'],a:0,e:'Phin tắc gây tiết lưu ngay tại phin nên phin lạnh.'},
 {q:'Phương pháp dò điện áp theo mạch: điểm trước thiết bị có điện, điểm sau không có. Kết luận:',o:['Thiết bị đó hở mạch','Thiết bị đó chập','Nguồn mất','Bình thường'],a:0,e:'Điện áp mất qua thiết bị – tiếp điểm hở hoặc dây đứt tại đó.'},
 {q:'Mắt gas báo màu vàng (ẩm cao), xử lý:',o:['Nạp thêm gas','Thay phin sấy lọc, có thể nhiều lần, hút chân không kỹ','Thay quạt','Chỉnh van tiết lưu'],a:1,e:'Ẩm cao phải được phin sấy hấp thụ – thay đến khi mắt gas về màu xanh.'},
 {q:'Bầu cảm biến van tiết lưu nhiệt bị mất gas thì van:',o:['Mở to hoàn toàn','Đóng lại, dàn thiếu lỏng','Không ảnh hưởng','Rò gas ra ngoài liên tục'],a:1,e:'Không còn lực mở từ bầu, lò xo đóng van.'},
 {q:'Thay máy nén bị cháy, bắt buộc phải:',o:['Chỉ thay máy nén','Xúc rửa, lắp phin chống axit, kiểm tra dầu sau khi chạy','Nạp thừa gas','Bỏ rơ le nhiệt'],a:1,e:'Axit trong hệ thống sẽ phá hỏng máy nén mới.'}
];
QZ.b14=[
 {q:'Trước khi bảo dưỡng hệ thống điện, việc đầu tiên là:',o:['Tháo contactor','Tắt nguồn tổng, treo biển cảnh báo, kiểm tra lại không còn điện','Xịt nước tủ điện','Đo dòng'],a:1,e:'An toàn điện luôn là bước đầu tiên.'},
 {q:'Khi xịt rửa dàn ngưng phải:',o:['Xịt cả vào hộp điện','Che chắn mô tơ, hộp điện, bộ điều khiển','Xịt áp lực thật cao','Không cần tắt máy'],a:1,e:'Tránh nước vào thiết bị điện, áp lực vừa phải để không xẹp cánh.'},
 {q:'Mục đích vệ sinh dàn ngưng định kỳ:',o:['Làm đẹp','Giảm áp suất ngưng tụ, giảm dòng, tiết kiệm điện, máy bền','Tăng lượng gas','Giảm tiếng ồn quạt'],a:1,e:'Dàn sạch giải nhiệt tốt.'},
 {q:'Đầu cos lỏng trong tủ điện có thể gây:',o:['Tiết kiệm điện','Phát nóng, cháy dây, mất pha, hỏng máy nén','Tăng lượng gas','Không ảnh hưởng'],a:1,e:'Siết lại đầu nối là việc quan trọng khi bảo dưỡng điện.'},
 {q:'Hệ thống nước ngưng bị tắc sẽ:',o:['Tủ lạnh hơn','Nước tràn, đọng trong quầy, rơi ra sàn','Áp suất hút tăng','Máy nén ngắt'],a:1,e:'Phải vệ sinh máng, thông ống, kiểm tra độ dốc.'},
 {q:'Khi kiểm tra thấy thiếu gas, trước khi nạp bổ sung phải:',o:['Tăng điện áp','Tìm và xử lý chỗ rò','Thay quạt','Vệ sinh lưới lọc'],a:1,e:'Nạp mà không xử lý rò thì gas sẽ tiếp tục hao.'},
 {q:'Bảo dưỡng quạt gồm:',o:['Chỉ thay cánh','Chạy thử nhận định tình trạng, kiểm tra cánh, tra dầu mỡ','Tháo bỏ tụ quạt','Đổi chiều quay'],a:1,e:'Đúng các bước trong chương trình (5.1 chạy thử, 5.2 tra dầu mỡ).'},
 {q:'Ghi số liệu trước và sau bảo dưỡng nhằm:',o:['Cho đủ thủ tục','So sánh hiệu quả, phát hiện xu hướng hư hỏng, làm căn cứ bảo hành','Tăng giá dịch vụ','Không có tác dụng'],a:1,e:'Số liệu giúp đánh giá tình trạng thiết bị theo thời gian.'}
];

/* ================= Ngân hàng câu hỏi bổ sung cho THI ĐÁNH GIÁ =================
   Đề thi lấy ngẫu nhiên từ: câu luyện tập cuối chương (QZ) + các câu bổ sung (QX) dưới đây.
   Mỗi câu: q = câu hỏi, o = 4 phương án, a = vị trí đáp án đúng (0=A, 1=B, 2=C, 3=D), e = giải thích. */
window.QX={};
QX.b1=[
 {q:'Thứ tự đúng của dòng gas trong hệ thống lạnh tủ lạnh là:',o:['Máy nén → dàn ngưng → phin sấy lọc → ống mao → dàn bay hơi → máy nén','Máy nén → ống mao → dàn ngưng → dàn bay hơi → máy nén','Máy nén → dàn bay hơi → phin sấy lọc → dàn ngưng → máy nén','Dàn ngưng → máy nén → ống mao → phin sấy lọc → dàn bay hơi'],a:0,e:'Nén → ngưng → lọc → tiết lưu → bay hơi → về nén.'},
 {q:'Nhiệm vụ của dàn ngưng tụ (dàn nóng) là:',o:['Thu nhiệt trong tủ','Thải nhiệt ra môi trường, ngưng hơi gas thành lỏng','Giảm áp suất gas','Lọc ẩm cho hệ thống'],a:1,e:'Hơi gas nóng cao áp nhả nhiệt ra không khí xung quanh và ngưng tụ thành lỏng cao áp.'},
 {q:'Gas đi ra khỏi dàn ngưng tụ ở trạng thái:',o:['Hơi, áp suất thấp','Lỏng, áp suất cao','Lỏng + hơi, áp suất thấp','Hơi quá nhiệt, áp suất thấp'],a:1,e:'Sau khi thải nhiệt, hơi gas ngưng thành lỏng nhưng vẫn ở áp suất cao.'},
 {q:'Gas ra khỏi ống mao, vào dàn bay hơi ở trạng thái:',o:['Lỏng cao áp, nóng','Hơi cao áp, nóng','Lỏng + hơi, áp suất thấp, nhiệt độ thấp','Chỉ có hơi khô'],a:2,e:'Qua ống mao, áp suất và nhiệt độ giảm đột ngột; một phần lỏng hóa hơi.'},
 {q:'Phía thấp áp của hệ thống lạnh tủ lạnh gồm:',o:['Đầu đẩy máy nén, dàn ngưng','Đầu ra ống mao, dàn bay hơi, đường hút về máy nén','Phin sấy lọc, đầu vào ống mao','Dàn ngưng, phin sấy lọc'],a:1,e:'Ranh giới cao – thấp áp là máy nén và ống mao.'},
 {q:'Ở máy nén piston, khi piston đi xuống thì:',o:['Van đẩy mở, gas bị đẩy ra','Van hút mở, hơi gas được hút vào xi lanh','Cả hai van đều mở','Cả hai van đều đóng và gas bị nén'],a:1,e:'Piston đi xuống tạo áp thấp trong xi lanh, van hút mở cho hơi gas vào.'},
 {q:'Trên block tủ lạnh, ống có đường kính lớn nhất thường là:',o:['Ống đẩy','Ống hút','Ống nạp','Ống mao'],a:1,e:'Ống hút dẫn hơi gas áp thấp (thể tích lớn) nên thường to nhất.'},
 {q:'Ống nạp (ống công nghệ) trên block dùng để:',o:['Dẫn gas tới dàn ngưng','Hút chân không, nạp gas, sau đó bấm kín','Nối với ống mao','Xả dầu máy nén'],a:1,e:'Ống nạp là ống cụt dành cho thao tác hút chân không và nạp gas.'},
 {q:'Tủ lạnh trực tiếp làm lạnh thực phẩm chủ yếu bằng:',o:['Quạt thổi gió lạnh','Đối lưu tự nhiên của không khí trong tủ','Bơm nước lạnh','Tấm sưởi'],a:1,e:'Không khí lạnh nặng chìm xuống, không khí ấm nhẹ bốc lên dàn lạnh.'},
 {q:'Ở tủ lạnh gián tiếp, nước xả đá được đưa tới:',o:['Ngăn rau','Khay hứng trên block, bay hơi nhờ nhiệt của block','Dàn bay hơi','Ống mao'],a:1,e:'Nước chảy theo ống thoát xuống khay hứng đặt trên block và tự bay hơi.'},
 {q:'Ống sưởi viền cửa (một đoạn ống đẩy nóng chạy quanh mép cửa) có tác dụng:',o:['Tăng áp suất hút','Chống đọng sương ở mép cửa, giữ ron không bị chai','Làm lạnh ngăn đông','Xả đá dàn lạnh'],a:1,e:'Mép cửa được sưởi ấm nhẹ nên không đọng sương, ron cửa mềm, kín.'},
 {q:'Dàn ngưng tụ làm mát cưỡng bức bằng quạt thường gặp trên:',o:['Tủ lạnh mini 1 cửa','Tủ side by side, tủ mát, tủ đông','Mọi tủ lạnh 2 cửa nhỏ','Tủ lạnh đời cũ dùng gas R12'],a:1,e:'Thiết bị công suất lớn cần quạt để tăng khả năng thải nhiệt.'},
 {q:'Bên trong phin sấy lọc có:',o:['Lưới lọc và hạt hút ẩm','Lò xo và màng','Tụ điện','Bánh răng'],a:0,e:'Lưới lọc giữ cặn bẩn; hạt hút ẩm (zeolit, silicagel) giữ hơi nước.'},
 {q:'Dàn ngưng bám bụi dày, đặt sát tường thì:',o:['Tủ lạnh sâu hơn','Áp suất ngưng tăng, máy nén nóng, tủ kém lạnh và hao điện','Áp suất hút giảm về chân không','Không ảnh hưởng gì'],a:1,e:'Thải nhiệt kém làm áp suất, nhiệt độ ngưng tăng, máy nén làm việc nặng.'},
 {q:'Núm cửa gió trong ngăn mát của tủ quạt gió dùng để:',o:['Bật tắt máy nén','Chia lượng gió lạnh giữa ngăn đông và ngăn mát','Điều chỉnh áp suất gas','Bật đèn'],a:1,e:'Mở cửa gió to → ngăn mát nhận nhiều gió lạnh hơn (quá to có thể đóng đá).'}
];
QX.b2=[

 {q:'Gia đình 4 người nên chọn tủ lạnh dung tích khoảng (tính 50 – 70 lít mỗi người):',o:['50 – 90 lít','200 – 280 lít','500 – 600 lít','1000 lít'],a:1,e:'4 × (50 – 70) = 200 – 280 lít.'},
 {q:'Cách đo nhiệt độ ngăn mát đúng là:',o:['Đặt nhiệt kế sát dàn lạnh khi vừa mở cửa','Đặt nhiệt kế trong ly nước ở giữa ngăn, đọc sau 2 – 3 giờ không mở cửa','Đo nhiệt độ vỏ block','Đo nhiệt độ dàn nóng'],a:1,e:'Ly nước giữ nhiệt ổn định, phản ánh nhiệt độ thực của thực phẩm.'},

QX.b3=[
 {q:'Chân C của block tủ lạnh là:',o:['Đầu cuộn đề','Điểm nối chung của cuộn chạy và cuộn đề','Đầu cuộn chạy','Chân nối vỏ'],a:1,e:'C (common) là điểm chung bên trong của hai cuộn dây.'},

 {q:'Sơ đồ khởi động CSIR có đặc điểm:',o:['Tụ khởi động nối tiếp cuộn đề qua rơ le, mômen khởi động lớn','Không có cuộn đề','Tụ ngậm làm việc liên tục','Chỉ dùng cho quạt'],a:0,e:'CSIR dùng cho block lớn cần mômen khởi động cao (tủ đông, tủ mát công nghiệp).'},
 {q:'Sơ đồ RSCR (PTC + tụ ngậm) có ưu điểm:',o:['Không cần rơ le bảo vệ','Hệ số công suất cao, tiết kiệm điện','Không cần cuộn đề','Không cần thermostat'],a:1,e:'Tụ ngậm nối cuộn đề làm việc liên tục, giảm dòng, tăng cos φ.'},
 {q:'Sau khi tắt tủ, nên chờ 3 – 5 phút mới cấp điện lại vì:',o:['Để dầu nguội','Áp suất hai phía cân bằng và rơ le PTC nguội lại','Để gas bay hơi hết','Để đèn tắt'],a:1,e:'Khởi động khi áp suất chưa cân bằng hoặc PTC còn nóng sẽ làm block khó khởi động, nhảy bảo vệ.'},

 {q:'Chạy thử block, bịt nhẹ ngón tay ở ống hút thấy hút mạnh, ống đẩy thổi mạnh. Kết luận:',o:['Block yếu','Khả năng nén của block tốt','Block chạm vỏ','Đứt cuộn đề'],a:1,e:'Hút và đẩy mạnh cho thấy cơ cấu nén, clapê còn tốt.'},
 {q:'Không nên để block chạy thử lâu khi hở ống vì:',o:['Tốn gas','Block hút không khí ẩm vào dầu và có thể quá nhiệt','Làm hỏng ống mao','Đồng hồ sẽ hỏng'],a:1,e:'Chỉ chạy thử thời gian ngắn rồi ngắt điện.'},
 {q:'Dòng điện làm việc của block tủ lạnh gia đình thường khoảng:',o:['0,05 – 0,1 A','0,5 – 1,2 A','5 – 10 A','20 – 30 A'],a:1,e:'So với dòng định mức ghi trên nhãn block.'},
 {q:'Đo thấy R_RS nhỏ hơn rõ rệt so với R_CR + R_CS. Block bị:',o:['Bình thường','Chập vòng cuộn dây','Đứt cuộn chạy','Thiếu gas'],a:1,e:'Hệ thức cộng điện trở không đúng là dấu hiệu cuộn dây bị chập.'}

QX.b4=[

QX.b5=[

 {q:'Trong mạch dùng nút nhấn cửa 3 cực ở ngăn mát, chân COM nối về:',o:['Chân 4 timer','Dây N','Thermostat','Sò lạnh'],a:1,e:'COM về N; NC nối đèn; NO nối quạt.'},

 {q:'Sau khi lắp mạch xong, việc phải làm trước khi cấp điện là:',o:['Nạp gas','Kiểm tra nguội bằng đồng hồ vạn năng và báo giáo viên','Vặn thermostat mức cao nhất','Tháo rơ le bảo vệ'],a:1,e:'Kiểm tra nguội phát hiện chập mạch, đấu sai trước khi có điện.'},

/* ================= CÂU HỎI, ĐỀ THI LẤY TỪ GOOGLE SHEET =================
   Trắc nghiệm trên slide và ngân hàng đề thi đọc từ trang "NganHang", đề thi từ trang "DeThi",
   lớp và lời nhắn từ trang "CauHinh" của Google Sheet (qua link Web App trong CAU_HINH_THI).
   Thứ tự ưu tiên: dữ liệu mới tải từ Google Sheet → bản đã tải lần trước (lưu trên máy) → câu hỏi có sẵn trong file. */
(function(){
'use strict';
const CODES=['b1','b2','b3','b4','b5','inv','b6','b7','b8','b9','b10','b11','b12','b13','b14'];
const label=c=>c==='inv'?'Inverter':'Bài '+c.slice(1);
const CHN={b1:'Nguyên lý hoạt động, cấu tạo tủ lạnh gia đình',b2:'Các đặc tính vận hành của tủ lạnh',b3:'Động cơ máy nén',b4:'Thiết bị điện, bảo vệ và tự động',
 b5:'Hệ thống điện tủ lạnh',inv:'Công nghệ Inverter trên tủ lạnh',b6:'Cân cáp tủ lạnh',b7:'Nạp gas tủ lạnh',b8:'Những hư hỏng thông thường và cách sửa chữa',
 b9:'Sử dụng, bảo dưỡng tủ lạnh',b10:'Cấu tạo, nguyên lý hệ thống lạnh thương nghiệp',b11:'Hệ thống điện máy lạnh thương nghiệp',b12:'Lắp đặt hệ thống lạnh thương nghiệp',
 b13:'Sửa chữa hệ thống lạnh thương nghiệp',b14:'Bảo dưỡng hệ thống lạnh thương nghiệp'};
const two=n=>String(n).padStart(2,'0');
const txt=v=>String(v==null?'':v).replace(/ /g,' ').trim();
function codeOf(s){s=txt(s).toLowerCase();if(!s)return null;if(CODES.indexOf(s)>=0)return s;
  if(/inv|chuyên đề|chuyen de/.test(s))return 'inv';const m=s.match(/(\d{1,2})/);if(m){const n=+m[1];if(n>=1&&n<=14)return 'b'+n}return null}
function scopeOf(s){s=txt(s);if(!s)return [];if(/tất cả|tat ca|toàn bộ|toan bo|cả mô đun/i.test(s))return CODES.slice();
  const out=[];s.split(/[,;+\n]|\bvà\b/).forEach(p=>{p=p.trim();if(!p)return;
    const r=p.match(/(\d{1,2})\s*(?:-|–|—|đến|den)\s*(?:bài\s*)?(\d{1,2})/i);
    if(r){const a=+r[1],b=+r[2];for(let n=Math.min(a,b);n<=Math.max(a,b);n++)if(n>=1&&n<=14)out.push('b'+n);return}
    const c=codeOf(p);if(c)out.push(c)});
  return CODES.filter(c=>out.indexOf(c)>=0)}
function use(s){s=txt(s).toLowerCase();if(/ẩn|không dùng|khong dung|bỏ|tắt/.test(s))return{slide:false,exam:false};
  const slide=/slide|trình chiếu|trinh chieu/.test(s);return{slide,exam:/thi/.test(s)||!slide}}

  const B=bank();const ch=ex.ch.filter(k=>B[k]&&B[k].length);
  const n=Math.min(ex.soCau,bankSize(ch));
  const pools={},take={};ch.forEach(k=>{pools[k]=shuffle(B[k].slice());take[k]=0});
  let left=n;/* chia đều số câu cho các bài, phần dư bốc ngẫu nhiên */
  while(left>0){let moved=false;for(const k of shuffle(ch.slice())){if(left<=0)break;if(take[k]<pools[k].length){take[k]++;left--;moved=true}}if(!moved)break}

  topBtn.setAttribute('aria-label',mode==='submit'?'Nộp bài':'Đóng phần thi');

let screen='';
function view(html,mode,scr){screen=scr||'';bodyEl.innerHTML=html;bodyEl.scrollTop=0;setTop(mode||'close');tmEl.hidden=!(st&&!st.done);root.classList.toggle('running',!!(st&&!st.done));try{bodyEl.focus({preventScroll:true})}catch(e){}}

/* ---------- 1. danh sách bài thi ---------- */
function best(id){const h=S.get('exam_hist',[]).filter(x=>x.ex===id);if(!h.length)return null;return Math.max(...h.map(x=>x.score))}
function card(ex){const b=best(ex.id),lock=ex.mo===false,n=Math.min(ex.soCau,bankSize(ex.ch));
  return `<button class="exc${lock?' lock':''}" data-ex="${ex.id}"${lock?' disabled':''}><span class="exc-n">${esc(ex.lab)}</span><span class="exc-t">${esc(ex.grp==='bai'?ex.sub:ex.sub)}</span>
   <span class="exc-m">${n} câu · ${String(ex.phut).replace('.',',')} phút</span>${lock?'<span class="exc-b lk">Chưa mở</span>':b!=null?`<span class="exc-b">Điểm cao nhất: ${fmtScore(b)}</span>`:''}</button>`}
function grpHead(g){const a=EXAMS.filter(e=>e.grp===g);if(!a.length)return '';
  const same=a.every(e=>e.soCau===a[0].soCau&&e.phut===a[0].phut);
  return `<h2>${GRPN[g]}${same?` <small>${a[0].soCau} câu · ${a[0].phut} phút</small>`:''}</h2><div class="exgrid${g==='dk'?' two':g==='kt'?' one':''}">${a.map(card).join('')}</div>`}
function home(){
  st=null;const pr=S.get('exam_run',null),pm=metaOf(pr);
  const hist=S.get('exam_hist',[]).slice(-8).reverse();
  view(`<div class="exw">
   <div class="exhero"><h1>Thi đánh giá kiến thức</h1><p>Mô đun MĐ18 – Sửa chữa, bảo trì tủ lạnh dân dụng. Chọn bài thi, nhập họ tên và làm bài trong thời gian quy định. Bài làm được chấm điểm ngay${LINK?' và gửi về giáo viên':''}.</p></div>

   ${pr&&!pr.done&&pm?`<div class="exresume"><div><b>Em đang làm dở: ${esc(pm.ten)}</b><span>Thí sinh ${esc(pr.name)} – thời gian vẫn đang tính, còn khoảng ${mmss((pr.t1-Date.now())/1000)}</span></div><button class="exbtn pri" data-go="resume">Làm tiếp</button></div>`:''}
   ${LINK?'':'<div class="exnote">Phần thi chưa được kết nối Google Sheet: kết quả chỉ lưu trên máy này. Sau khi thi, em chụp màn hình kết quả gửi giáo viên.</div>'}
   ${grpHead('bai')}${grpHead('dk')}${grpHead('kt')}
   ${hist.length?`<h2>Bài đã làm trên máy này</h2><div class="exhist">${hist.map(h=>`<div><span class="d">${dt(h.ts)}</span><span class="t">${esc(EX[h.ex]?EX[h.ex].lab:(h.lab||h.ex))} · ${esc(h.name)}</span><b>${fmtScore(h.score)}</b><span class="s ${h.sent?'ok':LINK?'pd':'lc'}" title="${h.sent?'Đã gửi về giáo viên':LINK?'Chưa gửi được, sẽ gửi lại':'Chỉ lưu trên máy'}">${h.sent?'Đã gửi':LINK?'Chờ gửi':'Trên máy'}</span></div>`).join('')}</div>`:''}
   <div class="exfoot"><button class="exlink" data-go="gv">Dành cho giáo viên: Google Sheet, ngân hàng câu hỏi</button><span>${AUTHOR}</span></div></div>`,'close','home');
  bodyEl.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>reg(EX[b.dataset.ex]));
  const r=bodyEl.querySelector('[data-go=resume]');if(r)r.onclick=resume;
  bodyEl.querySelector('[data-go=gv]').onclick=teacher;
