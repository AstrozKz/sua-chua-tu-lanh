<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sổ tay sửa chữa tủ lạnh – MĐ18</title>
<meta name="author" content="Huỳnh Hào Kiệt - Trường Trung cấp nghề Diên Khánh">
<meta name="description" content="Tra nhanh lỗi – nguyên nhân – khắc phục, giá trị cân cáp, nạp gas, áp suất – nhiệt độ, công suất block, quy trình sửa chữa tủ lạnh.">
<meta name="theme-color" content="#0a1626">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#0c1a2c;color:#ECF4FB;font-family:'Be Vietnam Pro','Segoe UI',Roboto,Arial,sans-serif}
/* ================= SỔ TAY + TÌM KIẾM (lớp phủ, đơn vị px thật) ================= */
.hb,.sx{--h-bg:#0c1a2c;--h-pn:#132a46;--h-pn2:#183251;--h-ln:#2C4C72;--h-ln2:#3B6290;--h-tx:#ECF4FB;--h-mu:#A3B9CF;--h-fr:#72D8F6;--h-ok:#4FD8A0;--h-bad:#FF7A6E;--h-vo:#FFD84A;--h-co:#E39D60;
  font-family:'Be Vietnam Pro','Segoe UI',Roboto,Arial,sans-serif;font-size:clamp(15px,.5vw + 10px,19px);line-height:1.5;color:var(--h-tx);-webkit-text-size-adjust:100%}
.hb *,.sx *{box-sizing:border-box}
.hb button,.sx button{font:inherit;color:inherit;cursor:pointer}
.hb[hidden],.sx[hidden],.hb [hidden],.sx [hidden]{display:none!important}
.hb :focus-visible,.sx :focus-visible{outline:3px solid var(--h-vo);outline-offset:2px}
.sx-head input:focus-visible,.hb-q input:focus-visible{outline:none}
.hb mark,.sx mark{background:rgba(255,216,74,.32);color:#fff;border-radius:3px;padding:0 1px}
html.hb-open,html.hb-open body,html.sx-open,html.sx-open body{overflow:hidden}

/* ---------- Sổ tay ---------- */
.hb{position:fixed;inset:0;z-index:950;display:flex;flex-direction:column;background:var(--h-bg)}
.hb-top{flex:none;display:flex;align-items:center;gap:14px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top));background:#0a1626;border-bottom:1px solid var(--h-ln)}
.hb-brand{display:flex;align-items:center;gap:10px;min-width:0}
.hb-logo{flex:none;width:40px;height:40px;border-radius:11px;background:var(--h-co);color:#2a1505;display:grid;place-items:center}
.hb-logo svg{width:24px;height:24px}
.hb-tt{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.hb-tt b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:1.35em;font-weight:700;white-space:nowrap}
.hb-tt small{font-size:.68em;color:var(--h-mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-q{flex:1;max-width:560px;margin-left:auto;display:flex;align-items:center;gap:8px;background:#0b1828;border:1px solid var(--h-ln2);border-radius:12px;padding:0 6px 0 12px;min-height:44px}
.hb-q:focus-within{border-color:var(--h-fr)}
.hb-q svg{flex:none;width:20px;height:20px;color:var(--h-mu)}
.hb-q input{flex:1;min-width:0;border:0;background:transparent;color:#fff;font:inherit;font-size:max(16px,1em);padding:9px 0;outline:0}
.hb-q input::-webkit-search-cancel-button{display:none}
.hb-qx{border:0;background:none;width:34px;height:34px;border-radius:8px;font-size:1.3em;color:var(--h-mu)}
.hb-x{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--h-ln2);background:#10243c;font-size:1.5em;line-height:1}
.hb-wrap{flex:1;min-height:0;display:flex}
.hb-nav{flex:none;width:280px;overflow-y:auto;padding:12px 10px;border-right:1px solid var(--h-ln);background:#0e1f35;display:flex;flex-direction:column;gap:4px}
.hb-nav button{display:flex;align-items:flex-start;gap:10px;text-align:left;border:0;background:transparent;border-radius:12px;padding:10px 12px;color:#cfdeec}
.hb-nav button svg{flex:none;width:22px;height:22px;margin-top:2px;color:var(--h-fr)}
.hb-nav button b{display:block;font-weight:600}
.hb-nav button small{display:block;font-size:.76em;color:var(--h-mu);line-height:1.3;margin-top:2px}
.hb-nav button:hover{background:rgba(114,216,246,.08)}
.hb-nav button.on{background:rgba(114,216,246,.16);color:#fff}
.hb-nav button.on svg{color:var(--h-vo)}
.hb-main{flex:1;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:18px 22px calc(40px + env(safe-area-inset-bottom));outline:0}
.hb-main>*{max-width:1180px;margin-left:auto;margin-right:auto}
.hb-h{display:flex;gap:14px;align-items:center;margin:2px auto 16px}
.hb-hic{flex:none;width:48px;height:48px;border-radius:14px;background:rgba(114,216,246,.12);color:var(--h-fr);display:grid;place-items:center}
.hb-hic svg{width:28px;height:28px}
.hb-h h2{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:1.9em;line-height:1.05;margin:0;font-weight:700}
.hb-h p{margin:2px 0 0;color:var(--h-mu);font-size:.92em}
.hb-lead{color:var(--h-mu);margin:0 auto 14px}
.hb-card{background:var(--h-pn);border:1px solid var(--h-ln);border-radius:16px;padding:16px 18px;margin-bottom:14px;scroll-margin-top:10px}
.hb-card.flash{animation:hbflash 1.8s ease}
@keyframes hbflash{0%,40%{box-shadow:0 0 0 3px var(--h-vo);border-color:var(--h-vo)}100%{box-shadow:none}}
.hb-ch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.hb-ch h3{margin:0;font-size:1.12em;line-height:1.35;flex:1;min-width:220px}
.hb-g{font-size:.74em;font-weight:700;color:var(--h-co);background:rgba(227,157,96,.14);border-radius:999px;padding:3px 10px;white-space:nowrap}
.hb-note{margin:0 0 10px;padding:10px 12px;border-radius:10px;background:rgba(114,216,246,.07);border-left:3px solid var(--h-fr);font-size:.9em;color:#d8e6f2}
.hb-sl{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--h-ln2);background:#10243c;border-radius:999px;padding:4px 12px 4px 8px;font-size:.8em;font-weight:600;color:var(--h-fr);white-space:nowrap;vertical-align:middle}
.hb-sl svg{width:18px;height:18px}
.hb-sl:hover{background:#17304f}
.hb-tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hb-tb{width:100%;border-collapse:collapse;font-size:.93em}
.hb-tb th,.hb-tb td{border:1px solid var(--h-ln);padding:8px 10px;text-align:left;vertical-align:top}
.hb-tb thead th{background:#1d3b5e;font-weight:700;font-size:.92em}
.hb-tb tbody tr:nth-child(even) td{background:rgba(255,255,255,.025)}
.hb-ft td:nth-child(1){width:30%}.hb-ft td:nth-child(2){width:38%}
.hb-tb code{font-family:Consolas,'Courier New',monospace;font-weight:700;color:var(--h-vo);background:#0b1828;border-radius:6px;padding:1px 6px;white-space:nowrap}
.hb-chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 auto 14px}
.hb-chip{border:1px solid var(--h-ln2);background:#10243c;border-radius:999px;padding:6px 14px;font-size:.88em;font-weight:600;color:#cfdeec}
.hb-chip.on{background:var(--h-fr);border-color:var(--h-fr);color:#06223a}
.hb-p{padding:0;overflow:hidden}
.hb-p summary{list-style:none;cursor:pointer;padding:14px 18px 14px 48px;position:relative;display:flex;flex-direction:column;gap:2px}
.hb-p summary::-webkit-details-marker{display:none}
.hb-p summary::before{content:"";position:absolute;left:18px;top:19px;width:10px;height:10px;border-right:3px solid var(--h-fr);border-bottom:3px solid var(--h-fr);transform:rotate(-45deg);transition:transform .2s}
.hb-p[open] summary::before{transform:rotate(45deg)}
.hb-p summary:hover{background:rgba(114,216,246,.05)}
.hb-pt{font-weight:700;font-size:1.06em}
.hb-pg{font-size:.88em;color:var(--h-mu)}
.hb-pb{padding:4px 18px 16px 18px;border-top:1px solid var(--h-ln)}
.hb-tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:12px 0}
.hb-tools svg{width:20px;height:20px;color:var(--h-co)}
.hb-tools span{font-size:.82em;background:#0e2036;border:1px solid var(--h-ln);border-radius:999px;padding:2px 10px}
.hb-steps{list-style:none;counter-reset:st;margin:6px 0;padding:0}
.hb-steps li{counter-increment:st;position:relative;padding:6px 0 6px 44px;min-height:34px}
.hb-steps li::before{content:counter(st);position:absolute;left:0;top:4px;width:30px;height:30px;border-radius:50%;background:#1d3b5e;border:1px solid var(--h-ln2);display:grid;place-items:center;font-weight:700;font-size:.9em;color:var(--h-fr)}
.hb-steps li+li{border-top:1px dashed rgba(59,98,144,.45)}
.hb-warn{display:flex;gap:10px;margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(255,122,110,.1);border:1px solid rgba(255,122,110,.45)}
.hb-warn svg{flex:none;width:22px;height:22px;color:var(--h-bad);margin-top:2px}
.hb-warn ul{margin:0;padding-left:18px;font-size:.92em}
.hb-pf{margin-top:12px;font-size:.88em;color:var(--h-mu)}
.hb-safe{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.hb-safe div{background:#0e2036;border:1px solid var(--h-ln);border-radius:12px;padding:10px 12px}
.hb-safe b{color:var(--h-vo)}.hb-safe p{margin:4px 0 0;font-size:.92em}
.hb-src{margin:0;padding-left:22px;font-size:.92em}.hb-src li{margin-bottom:5px}
.hb-src a{color:var(--h-fr)}
.hb-empty{background:var(--h-pn);border:1px dashed var(--h-ln2);border-radius:16px;padding:18px}
.hb-empty button{border:1px solid var(--h-ln2);background:#10243c;border-radius:999px;padding:3px 12px;margin:3px 2px;font-size:.9em}
/* máy tính áp suất – nhiệt độ */
.hb-cv{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:12px;align-items:end;margin-bottom:10px}
.hb-cv label span{display:block;font-size:.85em;font-weight:600;color:var(--h-mu);margin-bottom:4px}
.hb-cv input{width:100%;font:inherit;font-size:max(16px,1.1em);padding:10px 12px;border-radius:12px;border:1px solid var(--h-ln2);background:#0b1828;color:#fff;min-height:48px}
.hb-out{min-height:48px;display:flex;flex-direction:column;justify-content:center;padding:6px 14px;border-radius:12px;background:#0e2036;border:1px solid var(--h-ln)}
.hb-out b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:1.6em;line-height:1.1;color:var(--h-vo)}
.hb-out span{font-size:.82em;color:var(--h-mu)}
.hb-seg{display:inline-flex;border:1px solid var(--h-ln2);border-radius:10px;overflow:hidden}
.hb-seg button{border:0;background:#10243c;padding:5px 14px;font-weight:700;font-size:.85em}
.hb-seg button.on{background:var(--h-fr);color:#06223a}
.hb-ptw{max-height:none}
.hb-ptb{font-variant-numeric:tabular-nums;min-width:560px}
.hb-ptb th,.hb-ptb td{text-align:right;padding:5px 10px;white-space:nowrap}
.hb-ptb tbody th{background:#1a3452;position:sticky;left:0;z-index:1}
.hb-ptb thead th:first-child{position:sticky;left:0;z-index:2}
.hb-ptb td.vac{color:#9fd8f0;background:rgba(114,216,246,.08)!important}
.hb-ptb .sel{background:rgba(227,157,96,.16)!important;font-weight:700}
@media (max-width:899px){
  .hb-top{flex-wrap:wrap;gap:8px 10px}
  .hb-brand{flex:1}
  .hb-q{order:3;flex:1 1 100%;max-width:none;margin:0}
  .hb-wrap{flex-direction:column}
  .hb-nav{width:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--h-ln);padding:8px;gap:6px;scrollbar-width:none}
  .hb-nav::-webkit-scrollbar{display:none}
  .hb-nav button{flex:none;align-items:center;padding:7px 12px;border:1px solid var(--h-ln);border-radius:999px;white-space:nowrap}
  .hb-nav button small{display:none}
  .hb-nav button svg{width:18px;height:18px;margin:0}
  .hb-main{padding:14px 12px calc(30px + env(safe-area-inset-bottom))}
  .hb-h h2{font-size:1.55em}
  .hb-card{padding:14px 12px;border-radius:14px}
}
@media (max-width:899px) and (max-height:500px){
  /* điện thoại xoay ngang: gom đầu trang về một hàng để còn chỗ đọc */
  .hb-top{flex-wrap:nowrap}
  .hb-q{order:0;flex:1 1 260px;min-width:200px}
  .hb-brand{flex:0 1 auto;min-width:0}
  .hb-tt small{white-space:nowrap}
}
@media (max-width:699px){
  /* bảng thành thẻ dọc cho dễ đọc trên điện thoại */
  .hb-tb:not(.hb-ptb) thead{display:none}
  .hb-tb:not(.hb-ptb),.hb-tb:not(.hb-ptb) tbody,.hb-tb:not(.hb-ptb) tr,.hb-tb:not(.hb-ptb) td{display:block;width:auto!important}
  .hb-tb:not(.hb-ptb) tr{border:1px solid var(--h-ln);border-radius:12px;margin-bottom:10px;overflow:hidden;background:#0f2238}
  .hb-tb:not(.hb-ptb) td{border:0;border-top:1px solid rgba(59,98,144,.4);padding:8px 12px;background:transparent!important}
  .hb-tb:not(.hb-ptb) td:first-child{border-top:0;background:#16304e!important}
  .hb-tb:not(.hb-ptb) td::before{content:attr(data-l);display:block;font-size:.72em;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--h-fr);margin-bottom:2px}
  .hb-cv{grid-template-columns:1fr}
  .hb-tt b{font-size:1.2em}
  .hb-tt small{white-space:normal;line-height:1.3}
  /* nhóm lỗi: một hàng vuốt ngang thay vì nhiều dòng */
  .hb-chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -12px 12px;padding:0 12px 4px;scrollbar-width:none;-webkit-mask:linear-gradient(90deg,#000 88%,transparent);mask:linear-gradient(90deg,#000 88%,transparent)}
  .hb-chips::-webkit-scrollbar{display:none}
  .hb-chips>*{flex:none;white-space:nowrap}
}

/* ---------- Tìm kiếm ---------- */
.sx{position:fixed;inset:0;z-index:960}
.sx-bg{position:absolute;inset:0;background:rgba(3,10,20,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sx-box{position:absolute;left:50%;top:6vh;transform:translateX(-50%);width:min(860px,94vw);max-height:86vh;display:flex;flex-direction:column;background:#10233b;border:1px solid var(--h-ln2);border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.6);overflow:hidden;animation:sxin .18s ease}
@keyframes sxin{from{opacity:0;transform:translate(-50%,-10px)}}
.sx-head,.sx-tabs,.sx-foot{flex:none}
.sx-head{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 18px;border-bottom:1px solid var(--h-ln)}
.sx-head>svg{flex:none;width:24px;height:24px;color:var(--h-fr)}
.sx-head input{flex:1;min-width:0;border:0;background:transparent;color:#fff;font:inherit;font-size:max(17px,1.2em);padding:10px 0;outline:0}
.sx-head input::-webkit-search-cancel-button{display:none}
.sx-x{flex:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--h-ln2);background:#0b1828;font-size:1.4em;line-height:1}
.sx-tabs{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--h-ln);overflow-x:auto;scrollbar-width:none}
.sx-tabs::-webkit-scrollbar{display:none}
.sx-tabs button{flex:none;border:1px solid var(--h-ln);background:transparent;border-radius:999px;padding:4px 12px;font-size:.86em;font-weight:600;color:#cfdeec}
.sx-tabs button span{display:inline-block;min-width:20px;text-align:center;font-size:.85em;background:#0b1828;border-radius:999px;padding:0 6px;margin-left:2px;color:var(--h-mu)}
.sx-tabs button.on{background:var(--h-fr);color:#06223a;border-color:var(--h-fr)}
.sx-tabs button.on span{background:rgba(6,34,58,.15);color:#06223a}
.sx-list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px}
.sx-r{display:flex;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.sx-r:hover{background:rgba(114,216,246,.06)}
.sx-r.on{background:rgba(114,216,246,.12);border-color:rgba(114,216,246,.4)}
.sx-ic{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#0b1828;color:var(--h-fr)}
.sx-ic svg{width:20px;height:20px}
.sx-r.t-book .sx-ic{color:var(--h-co)}.sx-r.t-quiz .sx-ic{color:var(--h-ok)}
.sx-c{min-width:0;flex:1}
.sx-l{display:block;font-size:.74em;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--h-mu)}
.sx-c b{display:block;line-height:1.35}
.sx-c p{margin:3px 0 0;font-size:.88em;color:#c9d9e8;line-height:1.45}
.sx-tap{display:inline-block;margin-top:4px;font-size:.8em;color:var(--h-ok);font-weight:600}
.sx-ans{display:none;margin-top:6px;padding:8px 10px;border-radius:10px;background:rgba(79,216,160,.1);border:1px solid rgba(79,216,160,.35);font-size:.9em}
.sx-ans span{color:#c9d9e8}
.sx-r.open .sx-ans{display:block}.sx-r.open .sx-tap{display:none}
.sx-go{margin-top:6px;border:1px solid var(--h-ln2);background:#10243c;border-radius:999px;padding:3px 12px;font-size:.88em;font-weight:600;color:var(--h-fr)}
.sx-empty{padding:12px 10px;color:var(--h-mu)}
.sx-empty p{margin:6px 0}
.sx-sug{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.sx-sug button{border:1px solid var(--h-ln2);background:#0e2036;border-radius:999px;padding:5px 14px;font-size:.9em;color:#e3eef8}
.sx-sug button:hover{border-color:var(--h-fr)}
.sx-hint{font-size:.85em}
.sx-more{text-align:center;color:var(--h-mu);font-size:.85em}
.sx-foot{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;border-top:1px solid var(--h-ln);font-size:.78em;color:var(--h-mu)}
.sx-foot kbd{font-family:inherit;font-size:.95em;border:1px solid var(--h-ln2);border-radius:5px;padding:0 5px;margin:0 2px;background:#0b1828;color:#e3eef8}
@media (max-width:699px){
  .sx-box{inset:0;left:0;top:0;transform:none;width:auto;max-height:none;border-radius:0;border:0;animation:none;padding-top:env(safe-area-inset-top)}
  .sx-foot span:first-child{display:none}
}
/* chữ tìm được trên slide */
mark.sxhl{background:#FFD84A;color:#08233a;border-radius:6px;padding:0 4px;box-shadow:0 0 0 4px rgba(255,216,74,.35);animation:sxhl 1s ease 3}
@keyframes sxhl{50%{box-shadow:0 0 0 10px rgba(255,216,74,0)}}
/* nút trên bài giảng */
.btn.hbtn{display:inline-flex;align-items:center;gap:10px}
.btn.hbtn svg{width:30px;height:30px;flex:none}
.hb-home .btn{font-size:24px;padding:12px 24px}
html.m .mtop .msx,html.m .mtop .mhb{width:40px}
html.m .mtop .msx svg,html.m .mtop .mhb svg{width:23px;height:23px}
@media (max-width:380px){html.m .mexam span{display:none}html.m .mexam{padding:0 8px!important}}
html.m .ms-tools .ms-hb{background:#17304f}
</style></head>
<body><noscript>Trình duyệt cần bật JavaScript để xem sổ tay.</noscript>
<script>window.SOTAY_STANDALONE=true;</script>
<script>
/* ================= SỔ TAY SỬA CHỮA TỦ LẠNH – DỮ LIỆU =================
   Nguồn: Sổ tay điện lạnh dân dụng (bản PDF giáo viên cung cấp), nội dung bài giảng MĐ18,
   hướng dẫn ứng dụng R600a/R290 của Secop, trang hỗ trợ chính hãng Samsung, LG,
   bảng áp suất – nhiệt độ của Hudson Technologies, bảng công suất block tổng hợp từ meta.vn, mytour.vn.
   Muốn sửa nội dung: sửa chữ trong dấu nháy '…'; giữ nguyên dấu phẩy, ngoặc. */
window.SOTAY={
updated:'11/2026',

   ['Rơ le bảo vệ (tẹc-mít, OLP)','Thông mạch (gần 0 Ω) ở nhiệt độ thường; hơ nóng thì mở','Không thông mạch; ngắt sớm (non)'],
   ['Thermostat','Thông mạch khi núm ở mức làm lạnh; mở khi nhúng bầu vào nước đá pha muối','Không đóng (block không chạy) hoặc không mở (chạy liên tục)'],
   ['Tụ điện','Đúng trị số µF, sai lệch ≤ ±10%; tụ ngậm vài µF, tụ đề hàng chục – hàng trăm µF','Phồng, chảy dầu; sai lệch lớn; chập (kim đứng ở 0 Ω)'],
   ['Quạt AC 220 V','Cuộn dây thông mạch (vài trăm Ω đến vài kΩ); quay tay nhẹ','Cuộn dây ∞; kẹt, khô bạc'],
   ['Quạt DC 12 V (tủ điện tử)','Đo điện áp cấp từ board; không cấp 220 V','Có điện áp mà không quay'],

   ['Công tắc cửa 3 cực','COM – NC (đèn) thông khi nhả; COM – NO (quạt) thông khi nhấn','Tiếp điểm không chuyển, chập chờn']]},
 {id:'t-sensor',sec:'lk',title:'Trị số cảm biến (sensor) tủ lạnh theo hãng',note:'Đo ở nhiệt độ khoảng 30 °C. Chỉ tủ dùng board điện tử mới có sensor; tủ dùng timer không có. Trị số do đơn vị vật tư cung cấp và kinh nghiệm thực tế, có thể chênh lệch vài kΩ so với hãng.',s:'b4-12',

   ['R-CAP, RUN CAPACITOR / S-CAP','Tụ ngậm / tụ đề'],['T-STAT, THERMOSTAT','Rơ le nhiệt độ'],['TIMER, DEF. TIMER','Timer xả đá'],
   ['DEF-HEATER, DEFROST HEATER, HEATER CORD','Điện trở xả đá'],['DEF. THERMO, BIMETAL, THERMO','Sò lạnh (tủ cơ)'],['DFC, D-SENSOR, DEF SENSOR','Cảm biến xả đá (tủ điện tử)'],
   ['T-FUSE, THERMAL FUSE','Cầu chì nhiệt (sò nóng)'],['F-SENSOR, R-SENSOR, AMB SENSOR','Cảm biến ngăn đông, ngăn mát, môi trường'],['FAN MOTOR, F-FAN, C-FAN','Quạt dàn lạnh, quạt dàn nóng'],

 {id:'t-bom',sec:'gas',title:'Bơm chân không và mức chân không',s:'b7-7',

/* ---------------- 4. QUY TRÌNH ---------------- */
procs:[
 {id:'p-block',title:'Kiểm tra block còn dùng được hay không',goal:'Xác định block hỏng điện, hỏng cơ hay còn tốt trước khi quyết định thay.',tools:['Đồng hồ vạn năng','Ampe kìm','Rơ le khởi động, tẹc-mít đúng loại','Dây nguồn có cầu chì / CB'],s:'b3-9',
  steps:['Ngắt điện, tháo rơ le khởi động và tẹc-mít, làm sạch 3 chân block.',
   'Đo điện trở 3 cặp chân: xác định C, R, S (C–R nhỏ nhất, C–S lớn hơn, R–S lớn nhất). Kiểm tra R(R–S) = R(C–R) + R(C–S).',
   'Một cặp chân ∞ → đứt cuộn dây. Tổng không khớp hoặc trị số nhỏ bất thường → chập vòng. Block Inverter: 3 cặp U – V – W phải bằng nhau.',
   'Đo cách điện từng chân với vỏ (cạo sạch sơn chỗ đặt que): phải ∞. Thông mạch → chạm vỏ, phải thay.',
   'Kiểm tra rơ le khởi động và tẹc-mít còn tốt (xem bảng giá trị linh kiện).',
   'Đấu block chạy độc lập (quy trình bên dưới), kẹp ampe kìm: khởi động ngay, chạy êm, dòng xấp xỉ RLA.',
   'Thử khả năng nén trong thời gian ngắn: bịt nhẹ ngón tay ở ống hút thấy hút mạnh, ống đẩy thổi mạnh (hoặc gắn đồng hồ cao áp ở ống đẩy).',
   'Kết luận: tẹc-mít tạch liên tục khi cuộn dây và rơ le đều tốt → kẹt cơ. Hút, đẩy yếu → block yếu. Cả hai trường hợp đều thay block.'],
  warn:['Không để block chạy lâu khi hở ống (hút không khí ẩm vào dầu, block nóng).','Không cấp điện thẳng vào chân block mà không có tẹc-mít.','Không chạm tay vào ống đẩy – rất nóng.']},
 {id:'p-docl',title:'Đấu block chạy độc lập để thử',goal:'Cho block chạy riêng, không qua mạch điện của tủ, để biết block còn hoạt động hay không.',tools:['Dây nguồn 2 lõi có phích','Cầu chì hoặc CB, công tắc','Rơ le khởi động, tẹc-mít phù hợp','Ampe kìm'],s:'b3-8',
  steps:['Kiểm tra điện trở 3 cặp chân và cách điện với vỏ trước khi đấu.','Lắp rơ le khởi động đúng chiều, tẹc-mít áp sát vỏ block; nối đất vỏ block.',
   'Đấu dây nguồn: một dây qua tẹc-mít vào chân C, dây còn lại vào rơ le khởi động (cấp cho R, qua rơ le sang S) theo sơ đồ của rơ le.',
   'Kẹp ampe kìm vào một dây nguồn, bật công tắc: quan sát dòng khởi động rồi dòng chạy; nghe tiếng block.',
   'Thử nén nhanh ở ống hút, ống đẩy; ngắt điện sau 1 – 2 phút, ghi kết quả.'],
  warn:['Đứng tránh hướng ống đẩy (dầu, hơi nóng có thể phun ra).']},
 {id:'p-thieugas',title:'Kiểm tra nhanh thiếu gas, nghẹt bằng cách cô lập quạt',goal:'Phân biệt lỗi hệ thống lạnh (thiếu gas, nghẹt, block yếu) với lỗi quạt, xả đá, cửa – không cần mở hệ thống.',tools:['Tua vít','Đèn pin','Ampe kìm'],s:'b8-2',
  steps:['Tháo ốp sau ngăn đông, rút giắc quạt dàn lạnh (cô lập quạt). Tủ có dàn lộ thiên thì quan sát trực tiếp.',
   'Cấp điện cho block chạy liên tục khoảng 30 phút (tủ có timer: vặn sang chế độ làm lạnh), đóng cửa tủ.',
   'Mở cửa quan sát dàn lạnh: tuyết bám đều khắp dàn → đủ gas, không nghẹt; lỗi nằm ở quạt, xả đá, cửa tủ.',
   'Tuyết bám một đoạn đầu dàn → thiếu gas hoặc nghẹt ống mao không hoàn toàn. Đầu dàn chỉ đọng sương → block yếu hoặc thiếu gas nhiều.',
   'Kết hợp đo dòng điện và áp suất hút (nếu có van nạp) để khẳng định; tìm vết dầu loang để tìm chỗ xì.'],
  warn:['Đo xong lắp lại giắc quạt, ốp ngăn đông đúng vị trí.']},
 {id:'p-thukin',title:'Thử kín (thử xì) bằng Nitơ',goal:'Tìm chỗ xì và khẳng định hệ thống kín trước khi hút chân không, nạp gas.',tools:['Chai Nitơ + van giảm áp','Bộ đồng hồ nạp gas','Bọt xà phòng, cọ','Van nạp (nếu tủ chưa có)'],s:'b7-6',
  steps:['Nối: chai Nitơ → van giảm áp → dây vàng → bộ đồng hồ → dây xanh → van nạp của tủ.',
   'Chỉnh van giảm áp, mở van xanh nạp Nitơ đến áp suất thử: R600a 100 – 120 psi, R134a khoảng 150 psi. Khóa van.',
   'Giữ áp 15 – 30 phút (hoặc lâu hơn): kim đồng hồ không được tụt.',
   'Quét bọt xà phòng các mối hàn, phin, rắc co, dàn lộ; nghe tiếng xì. Dàn nóng âm, dàn lạnh khuất: cô lập từng dàn để thử riêng.',
   'Xả Nitơ, khắc phục chỗ xì (hàn, thay dàn), thử lại đến khi kín.'],
  warn:['Không dùng oxy (gây nổ khi gặp dầu) hoặc khí nén máy bơm hơi (có hơi ẩm).','Luôn qua van giảm áp – chai Nitơ áp suất rất cao.','Nén quá áp có thể làm nổ dàn lạnh nhôm.']},
 {id:'p-chankhong',title:'Hút chân không tủ lạnh',goal:'Loại bỏ không khí và hơi ẩm trong hệ thống (tránh tắc ẩm, axit hóa dầu, áp suất ngưng cao).',tools:['Bơm chân không ≥ 40 L/phút','Bộ đồng hồ nạp gas','Van nạp, phin 3 ngả (nếu hút hai phía)'],s:'b7-7',
  steps:['Hệ thống đã thử kín, đã thay phin mới.','Nối dây xanh vào van nạp của tủ, dây vàng vào bơm chân không; dây đỏ nối phía cao áp nếu có van thứ hai (phin 3 ngả).',
   'Mở van xanh (và van đỏ nếu hút hai phía), bật bơm.','Chờ kim đồng hồ xanh về −30 inHg (−76 cmHg, −0,1 MPa), rồi cho bơm chạy thêm ít nhất 30 phút. Tủ R600a, tủ từng bị ẩm: hút lâu hơn, dùng máy sấy tóc làm ấm dàn.',
   'Khóa van đồng hồ trước, rồi mới tắt bơm.','Giữ 5 – 10 phút: kim không được tăng. Kim tăng → còn xì hoặc còn ẩm, phải xử lý lại.'],
  warn:['Tắt bơm trước khi khóa van có thể làm dầu bơm bị hút ngược vào hệ thống.','Tủ chỉ có ống nạp phía hút: ống mao cản trở nên phía cao áp hút rất chậm – nên hút cả hai phía.']},
 {id:'p-napgas',title:'Nạp gas tủ lạnh theo cân (R134a, R600a)',goal:'Nạp đúng loại gas, đúng khối lượng ghi trên nhãn tủ.',tools:['Chai gas đúng loại','Cân điện tử','Bộ đồng hồ nạp gas','Ampe kìm','Kìm bấm ống, đèn hàn'],s:'b7-9',
  steps:['Hệ thống đã thử kín và hút chân không đạt. Đọc khối lượng và loại gas trên nhãn tủ.',
   'Đặt chai gas lên cân, nối dây vàng vào van chai. Xả khí dây vàng: mở van chai, nới đầu dây ở bộ đồng hồ 1 – 2 giây rồi siết lại.',
   'Đặt cân về 0. Nạp tĩnh: block chưa chạy, mở van xanh cho gas vào đến khi cân bằng áp suất.',
   'Cho block chạy, nạp tiếp từ từ ở thể hơi (chai dựng đứng), theo dõi số cân, áp suất hút, dòng điện.',
   'Đủ khối lượng: khóa van xanh, khóa van chai.',
   'Cho tủ chạy ổn định 20 – 30 phút, cửa đóng: kiểm tra áp suất hút (bảng cân cáp), dòng điện, tuyết bám đều dàn, ống hút về block mát.',
   'Block đang chạy: bấm dẹt ống nạp ở 2 vị trí cách nhau vài cm, cắt phía ngoài, kiểm tra không xì rồi hàn kín đầu ống. Thử xì lần cuối.'],
  warn:['R600a dễ cháy: nạp nơi thoáng, không có lửa, không hút thuốc; xả gas ngoài trời.','Không nạp gas lỏng vào phía hút khi block chạy (hỏng clapê).','R600a lượng nạp chỉ vài chục gam – sai 5 – 10 g đã ảnh hưởng lớn; dùng cân chính xác.']},
 {id:'p-cancapho',title:'Cân cáp hở',goal:'Chọn chiều dài ống mao (trở lực) phù hợp block và loại tủ, trước khi lắp kín hệ thống.',tools:['Block của tủ (đủ dầu)','Phin lọc mới, ống mao mới dài hơn dự kiến','Đồng hồ cao áp, chạc ba','Dao cắt ống mao, đèn hàn'],s:'b6-3',
  steps:['Nối: ống đẩy block → đồng hồ cao áp (qua chạc ba) → phin lọc → ống mao; đầu ống mao để hở.',
   'Ống hút để hở, bọc vải sạch để block không hút bụi.',
   'Chạy block 3 – 5 phút cho áp suất ổn định, đọc đồng hồ.',
   'So bảng giá trị cân cáp: áp cao hơn yêu cầu → cắt bớt ống mao từng đoạn 5 – 10 cm, chạy lại, đọc lại. Áp thấp hơn → ống quá ngắn, thay đoạn mới.',
   'Đạt giá trị: đánh dấu, hàn ống mao vào dàn bay hơi. Hàn xong cân lại để chắc mối hàn không làm nghẹt ống mao.'],
  warn:['Block hút không khí ẩm vào – chỉ chạy thời gian ngắn, thay phin mới khi lắp vào hệ thống.','Đeo kính: dầu có thể phun ra ở đầu ống mao.','Cắt ống mao bằng dao khía rồi bẻ, không dùng kìm làm bẹp miệng ống.']},
 {id:'p-cancapkin',title:'Cân cáp kín',goal:'Điều chỉnh ống mao trên hệ thống hoàn chỉnh đã nạp gas, theo áp suất hút và tuyết bám.',tools:['Đồng hồ thấp áp','Ampe kìm','Rắc co nối tạm ống mao'],s:'b6-5',
  steps:['Lắp hệ thống kín: block, dàn ngưng, phin mới, ống mao (nối tạm qua rắc co), dàn bay hơi.',
   'Gắn đồng hồ thấp áp ở ống nạp; thử kín, hút chân không, nạp gas đúng loại, đúng khối lượng.',
   'Chạy máy 20 – 30 phút: đọc áp suất hút, đo dòng, quan sát tuyết bám, nhiệt độ ống hút.',
   'Áp hút thấp, tuyết bám một đoạn đầu dàn → ống mao dài, cắt bớt. Áp hút cao, ống hút lạnh buốt, đọng sương về block → ống mao ngắn, thay đoạn dài hơn.',
   'Đạt: áp hút đúng bảng, tuyết bám đều, dòng xấp xỉ định mức → hàn cố định ống mao, chạy thử lần cuối.']},
 {id:'p-phin',title:'Thay phin sấy lọc',goal:'Phin mới hút ẩm, lọc bẩn – bắt buộc thay khi thay block, xử lý nghẹt, tắc ẩm, nạp gas lại.',tools:['Phin sấy lọc đúng loại','Dao cắt ống, dao khía ống mao','Đèn hàn, que hàn','Nitơ'],
  steps:['Xả hết gas (R600a xả ngoài trời, xa lửa).','Cắt ống vào phin và ống mao bằng dao cắt; không khò lửa tháo phin khi hệ thống còn gas.',
   'Thổi Nitơ làm sạch dàn ngưng, ống mao.','Mở nắp phin mới ngay trước khi hàn (để lâu phin hút ẩm không khí). Lắp đúng chiều mũi tên trên phin.',
   'Đưa ống mao vào phin khoảng 1 – 1,5 cm, không chạm lưới lọc; hàn ống mao và ống vào phin.','Thử kín, hút chân không, nạp gas.'],
  warn:['Cắt ống mao bằng dao khía, không bẻ dẹt miệng ống.','Hàn nhanh, không để lửa nung phin quá lâu.']},
 {id:'p-tacam',title:'Xử lý tắc ẩm',goal:'Loại bỏ nước trong hệ thống triệt để, tránh tắc lại và axit hóa dầu làm cháy block.',tools:['Nitơ','Phin sấy lọc mới','Bơm chân không','Máy sấy tóc / đèn sưởi'],s:'b8-8',
  steps:['Xác định: tủ lạnh rồi mất lạnh theo chu kỳ; chườm khăn nóng ở đầu ống mao vào dàn thấy gas chảy lại.',
   'Xả hết gas (R600a xả ngoài trời, xa lửa).','Cắt bỏ phin cũ; thổi Nitơ qua dàn lạnh, dàn nóng, ống mao để đẩy nước ra. Không dùng block hay máy nén khí để thổi.',
   'Thay dầu block nếu nhiễm ẩm nặng (có thể 2 – 3 lần).','Hàn phin sấy lọc mới, van nạp.',
   'Hút chân không lâu (ít nhất 30 phút sau khi đạt −30 inHg), làm ấm dàn bằng máy sấy tóc, đèn sưởi.','Nạp gas, chạy thử và theo dõi nhiều giờ.'],
  warn:['Không chỉ “nạp lại gas” – ẩm còn sẽ tắc lại và tạo axit ăn mòn cuộn dây block.']},
 {id:'p-nghet',title:'Xử lý nghẹt ống mao, nghẹt phin (tắc bẩn)',goal:'Thông lại đường gas khi bị cặn bẩn, dầu cháy làm nghẹt.',tools:['Nitơ, van giảm áp','Đồng hồ cao áp','Hóa chất xúc rửa','Ống mao, phin mới'],s:'b8-4',
  steps:['Xác định: áp hút xuống chân không, dàn nóng nguội, phin lạnh đọng sương (nghẹt hoàn toàn); hoặc cân cáp áp cao hơn chuẩn nhiều (nghẹt một phần).',
   'Xả gas, cắt phin. Thay phin mới, cân lại cáp để xem ống mao còn nghẹt không.',
   'Ống mao còn nghẹt: thổi Nitơ khoảng 100 psi; không thông thì xúc rửa hóa chất.','Vẫn nghẹt: thay ống mao mới, cân cáp.',
   'Thử kín, hút chân không, nạp gas, chạy thử.']},
 {id:'p-thayblock',title:'Thay block (máy nén)',goal:'Thay block hỏng bằng block phù hợp, hệ thống chạy ổn định lâu dài.',tools:['Block thay thế','Phin mới','Rơ le, tẹc-mít phù hợp','Đèn hàn, Nitơ, bơm chân không, gas, cân'],s:'b8-9',
  steps:['Khẳng định block hỏng (đã kiểm tra rơ le, tẹc-mít, nguồn, cuộn dây, khả năng nén).',
   'Chọn block thay: cùng gas, cùng điện áp, công suất lạnh phù hợp (tra datasheet theo LBP / MBP), kiểu khởi động, kích thước lắp.',
   'Xả gas, cắt ống bằng dao cắt; tháo rơ le, tẹc-mít, block cũ.','Lắp block mới lên đế cao su; giữ nút bịt ống đến lúc hàn để tránh ẩm.',
   'Thay phin mới; hàn ống hút, ống đẩy, ống nạp (cân cáp nếu block khác loại).','Thử kín, hút chân không, nạp gas theo nhãn.',
   'Lắp rơ le khởi động, tẹc-mít phù hợp block mới; chạy thử, đo dòng, áp suất.'],
  warn:['Block cháy (dầu đen, mùi khét): phải xúc rửa hệ thống, thay phin, có thể dùng phin chống axit – nếu không block mới sẽ cháy tiếp.','Tìm nguyên nhân làm hỏng block cũ (điện áp, thiếu gas, dàn nóng bẩn…) trước khi lắp block mới.']},
 {id:'p-xidan',title:'Xử lý xì dàn lạnh, dàn nóng',goal:'Khắc phục chỗ xì để hệ thống giữ được gas.',tools:['Nitơ, bọt xà phòng','Dàn mới / ống nối đồng – nhôm','Đèn hàn'],s:'b8-10',
  steps:['Tìm chỗ xì: vết dầu loang; nạp Nitơ đúng áp suất cho phép, quét bọt xà phòng; cô lập từng dàn để thử.',
   'Dàn lạnh nhôm bị xì: nên thay dàn mới; nối ống đồng – nhôm bằng ống nối chuyên dụng hoặc hàn nhôm đúng kỹ thuật.',
   'Dàn nóng âm vách bị xì: không hàn được bên trong – cô lập dàn cũ, lắp dàn nóng mới ngoài mặt sau tủ (diện tích tương đương).',
   'Ống đồng bị xì: làm sạch, hàn bạc hoặc hàn đồng.','Thay phin, thử kín, hút chân không, nạp gas, chạy thử.']},
 {id:'p-xada',title:'Kiểm tra hệ thống xả đá (tủ có timer)',goal:'Tìm linh kiện hỏng khi dàn lạnh đóng băng, tủ quạt không lạnh.',tools:['Đồng hồ vạn năng','Tua vít'],s:'b4-10c',
  steps:['Rút phích. Tháo ốp sau ngăn đông, quan sát dàn: đóng băng kín là hỏng xả đá.',
   'Vặn timer sang xả đá (nghe “tạch”): chân 3 – 2 phải thông. Đo cuộn dây timer chân 3 – 1: 18 – 25 kΩ.',
   'Đo điện trở xả đá: vài trăm Ω; cách điện với dàn ∞.','Đo cầu chì nhiệt: phải thông mạch.',
   'Sò lạnh: ở nhiệt độ phòng phải hở mạch; khi dàn còn băng (khoảng −4 °C) phải đóng. Sò lạnh có hơi ẩm, nghi ngờ → thay.',
   'Cầu chì nhiệt đứt thì thay luôn sò lạnh. Lắp lại, cho tủ chạy và thử chuyển timer sang xả đá: ampe kìm thấy dòng của điện trở (150 W ≈ 0,7 A).'],
  warn:['Không chạm vào điện trở xả đá khi đang có điện hoặc vừa xả đá xong.']},
 {id:'p-nguoi',title:'Kiểm tra nguội mạch điện tủ lạnh trước khi cấp điện',goal:'Phát hiện chập, hở mạch sau khi lắp hoặc sửa mạch điện.',tools:['Đồng hồ vạn năng'],s:'b5-5',
  steps:['Rút phích. Đo điện trở giữa 2 chân phích.','Thermostat ở OFF, cửa đóng: phải ∞ (hở mạch).',
   'Thermostat ON (timer ở làm lạnh): đo được điện trở của nhánh block (vài chục Ω). Gần 0 Ω → chập mạch.',
   'Tủ gián tiếp: vặn timer sang xả đá, nối tắt tạm sò lạnh: đo được nhánh điện trở xả đá (vài trăm Ω).',
   'Đo cách điện từng chân phích với vỏ tủ: phải ∞.','Đạt yêu cầu mới cấp điện chạy thử.']},
 {id:'p-inverter',title:'Kiểm tra ban đầu tủ Inverter',goal:'Kiểm tra an toàn, đúng thứ tự trên tủ dùng board Inverter.',tools:['Đồng hồ vạn năng','Tài liệu service của hãng'],s:'inv-6',
  steps:['Nhận biết: tem ghi Inverter; sơ đồ sau tủ có MAIN BOARD / INVERTER; block ký hiệu U – V – W; không có rơ le khởi động, tẹc-mít rời.',
   'Rút phích, chờ tụ DC xả (vài phút), đo lại điện áp tụ trước khi chạm vào board.',
   'Đo điện áp nguồn vào; quan sát mã lỗi, đèn báo (tra tài liệu hãng).','Đo điện trở cảm biến, so bảng trị số; kiểm tra quạt, công tắc cửa.',
   'Đo 3 cuộn dây U – V – W (bằng nhau) và cách điện với vỏ.','Board nghi hỏng: thử theo hướng dẫn hãng (ví dụ tải giả bóng đèn), không đoán mò thay linh kiện.'],
  warn:['Tủ Inverter có thể rò điện nhẹ ra vỏ do mạch lọc nhiễu – phải nối đất vỏ tủ chắc chắn.']},
 {id:'p-nhangas',title:'Xác định loại gas khi mất nhãn',goal:'Biết gas trong bình hoặc trong hệ thống để nạp đúng loại.',tools:['Đồng hồ áp suất','Nhiệt kế'],s:'b7-2',
  steps:['Cách 1: đọc nhãn tủ, nhãn block (thường ghi loại gas).',
   'Cách 2: để gas ở trạng thái bão hòa (bình gas, hoặc hệ thống dừng đủ lâu cho áp suất hai phía cân bằng).',
   'Đo áp suất (áp suất đồng hồ) và nhiệt độ của bình / hệ thống.',
   'Tra bảng áp suất – nhiệt độ (mục “Áp suất – nhiệt độ” của sổ tay): loại gas có áp suất bão hòa trùng với số đo là gas cần tìm. Ví dụ 97 psi ở 30 °C → R134a.']},
 {id:'p-baoduong',title:'Bảo dưỡng tủ lạnh định kỳ',goal:'Giữ tủ lạnh sâu, tiết kiệm điện, phát hiện sớm hư hỏng.',tools:['Chổi mềm, máy hút bụi, khí nén','Baking soda, khăn mềm','Ampe kìm, nhiệt kế'],s:'b9-6',
  steps:['Hỏi khách hàng tình trạng tủ; quan sát, nghe tiếng block khi đang chạy.','Ngắt điện, lấy thực phẩm ra, tháo khay, kệ.',
   'Vệ sinh trong tủ bằng nước ấm pha baking soda hoặc nước rửa nhẹ; lau ron cửa.','Thông ống thoát nước xả đá, rửa khay hứng nước trên block.',
   'Vệ sinh dàn nóng, quạt dàn nóng.','Kiểm tra ron cửa (kẹp tờ giấy), bản lề, chân cân bằng.','Kiểm tra điện: phích, dây, giắc cắm, rơ le, cách điện vỏ.',

  warn:['Chu kỳ: vệ sinh trong tủ 1 – 3 tháng; vệ sinh dàn nóng, kiểm tra điện 6 – 12 tháng.']},
 {id:'p-r600a',title:'Sửa chữa an toàn tủ dùng gas cháy R600a, R290',goal:'Tránh cháy nổ khi hàn, xả gas trên hệ thống dùng gas hydrocarbon.',tools:['Dao cắt ống','Nitơ','Cân điện tử','Bình chữa cháy'],s:'b7-12',
  steps:['Làm việc nơi thoáng, không có lửa, không hút thuốc; quạt thông gió; tắt thiết bị điện không chống cháy nổ gần đó.',
   'Mở hệ thống bằng dao cắt ống (không dùng đèn hàn để tháo ống).','Xả gas ra ngoài trời qua ống dẫn, xa nguồn lửa. Xả khí thải của bơm chân không ra ngoài.',
   'Thổi Nitơ riêng phía cao áp và phía thấp áp để đuổi hết gas còn lại.','Chỉ hàn khi đã đuổi sạch gas và có dòng Nitơ chảy trong ống.',
   'Nạp gas theo cân chính xác (sai số rất nhỏ), không vượt khối lượng ghi trên nhãn.'],
  warn:['Không chuyển tủ R12, R134a sang R600a, R290 (thiết bị điện của tủ không chống cháy nổ).','Không nạp R134a vào tủ thiết kế cho R600a.']}

 {id:'gas',name:'Cân cáp, nạp gas',sub:'Giá trị cân cáp, áp suất, lượng gas, chân không',ic:'gas'},
 {id:'pt',name:'Áp suất – nhiệt độ',sub:'Bảng bão hòa và máy tính quy đổi',ic:'pt'},
 {id:'block',name:'Máy nén (block)',sub:'Công suất, dòng điện, đọc nhãn, đánh giá',ic:'block'},
 {id:'lk',name:'Linh kiện, ký hiệu',sub:'Giá trị đo kiểm, sensor, ký hiệu sơ đồ',ic:'lk'},
 {id:'qt',name:'Quy trình',sub:'Các bước làm việc chuẩn',ic:'qt'},
 {id:'at',name:'An toàn, nguồn',sub:'An toàn khi sửa chữa, tài liệu tham khảo',ic:'at'}];
const SEC=k=>SECS.find(s=>s.id===k);

/* ---------- liên kết sang slide bài giảng ---------- */
function slideIdx(id){if(!id||!window.App||!App.slides)return -1;return App.slides.findIndex(s=>s.id===id)}
function slideBtn(id){const i=slideIdx(id);if(i<0)return '';return `<button type="button" class="hb-sl" data-slide="${i}" title="Mở slide bài giảng">${IC.slide}<span>Slide ${i+1}</span></button>`}

/* ---------- dựng giao diện ---------- */
let root,main,nav,qIn,cur=LS.get('hbsec','loi'),grp='all',opened=false,lastFocus=null,query='';
function mount(){
  if(root)return;
  root=document.createElement('div');root.id='hb';root.className='hb';root.hidden=true;root.setAttribute('role','dialog');root.setAttribute('aria-label','Sổ tay sửa chữa tủ lạnh');
  root.innerHTML=`<header class="hb-top"><div class="hb-brand"><span class="hb-logo">${IC.book}</span><span class="hb-tt"><b>Sổ tay sửa chữa tủ lạnh</b><small>${AUTHOR}</small></span></div>
   <label class="hb-q">${IC.search}<input type="search" placeholder="Tìm trong sổ tay: sò lạnh, cân cáp, R600a…" aria-label="Tìm trong sổ tay" enterkeyhint="search"><button type="button" class="hb-qx" aria-label="Xóa">×</button></label>
   ${STANDALONE?'':'<button type="button" class="hb-x" aria-label="Đóng sổ tay">×</button>'}</header>
   <div class="hb-wrap"><nav class="hb-nav" aria-label="Mục lục sổ tay">${SECS.map(s=>`<button type="button" data-sec="${s.id}">${IC[s.ic]}<span><b>${s.name}</b><small>${s.sub}</small></span></button>`).join('')}</nav>
   <main class="hb-main" tabindex="-1"></main></div>`;
  document.body.appendChild(root);
  main=root.querySelector('.hb-main');nav=root.querySelector('.hb-nav');qIn=root.querySelector('.hb-q input');
  nav.addEventListener('click',e=>{const b=e.target.closest('[data-sec]');if(!b)return;qIn.value='';query='';show(b.dataset.sec)});
  const x=root.querySelector('.hb-x');if(x)x.onclick=close;
  root.querySelector('.hb-qx').onclick=()=>{qIn.value='';query='';show(cur);qIn.focus()};
  let t=0;qIn.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>{query=qIn.value.trim();query?results():show(cur)},160)});
  main.addEventListener('click',onMain);
  main.addEventListener('input',onInput);
}
function setNav(){nav.querySelectorAll('[data-sec]').forEach(b=>{const on=!query&&b.dataset.sec===cur;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}
function head(s){return `<div class="hb-h"><span class="hb-hic">${IC[s.ic]}</span><div><h2>${s.name}</h2><p>${s.sub}</p></div></div>`}

/* bảng dữ liệu: trên điện thoại mỗi dòng thành một thẻ (data-l là nhãn cột) */
function table(t,terms,rowsOnly){const rows=rowsOnly||t.rows;
  return `<section class="hb-card" id="hb-${t.id}"><div class="hb-ch"><h3>${hl(t.title,terms)}</h3>${slideBtn(t.s)}</div>${t.note?`<p class="hb-note">${hl(t.note,terms)}</p>`:''}
   <div class="hb-tw"><table class="hb-tb"><thead><tr>${t.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td data-l="${esc(t.head[i]||'')}">${hl(c,terms)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`}
function fault(f,terms,rowsOnly){const rows=rowsOnly||f.rows;
  return `<section class="hb-card hb-f" id="hb-${f.id}"><div class="hb-ch"><h3>${hl(f.sym,terms)}</h3><span class="hb-g">${esc((D.groups.find(g=>g[0]===f.g)||[])[1]||'')}</span></div>
   ${f.note?`<p class="hb-note">${hl(f.note,terms)}</p>`:''}
   <div class="hb-tw"><table class="hb-tb hb-ft"><thead><tr><th>Nguyên nhân</th><th>Kiểm tra, dấu hiệu</th><th>Khắc phục</th></tr></thead><tbody>
   ${rows.map(r=>`<tr><td data-l="Nguyên nhân"><b>${hl(r.c,terms)}</b></td><td data-l="Kiểm tra, dấu hiệu">${hl(r.k,terms)}</td><td data-l="Khắc phục">${hl(r.x,terms)}${r.s?' '+slideBtn(r.s):''}</td></tr>`).join('')}</tbody></table></div></section>`}
function proc(p,terms,open){
  return `<details class="hb-card hb-p" id="hb-${p.id}"${open?' open':''}><summary><span class="hb-pt">${hl(p.title,terms)}</span><span class="hb-pg">${hl(p.goal||'',terms)}</span></summary>
   <div class="hb-pb">${p.tools&&p.tools.length?`<div class="hb-tools">${IC.tool}${p.tools.map(t=>`<span>${hl(t,terms)}</span>`).join('')}</div>`:''}
   <ol class="hb-steps">${p.steps.map(s=>`<li>${hl(s,terms)}</li>`).join('')}</ol>
   ${p.warn&&p.warn.length?`<div class="hb-warn">${IC.warn}<ul>${p.warn.map(w=>`<li>${hl(w,terms)}</li>`).join('')}</ul></div>`:''}
   ${slideBtn(p.s)?`<div class="hb-pf">Xem thêm trong bài giảng: ${slideBtn(p.s)}</div>`:''}</div></details>`}
function codes(c,terms,rowsOnly){const rows=rowsOnly||c.rows;
  return `<section class="hb-card" id="hb-code-${esc(c.brand)}"><div class="hb-ch"><h3>Tủ lạnh ${esc(c.brand)}</h3></div><p class="hb-note">${hl(c.note,terms)}</p>
   <div class="hb-tw"><table class="hb-tb hb-codes"><thead><tr><th>Mã lỗi</th><th>Ý nghĩa, hướng xử lý</th></tr></thead><tbody>${rows.map(r=>`<tr><td data-l="Mã lỗi"><code>${hl(r[0],terms)}</code></td><td data-l="Ý nghĩa">${hl(r[1],terms)}</td></tr>`).join('')}</tbody></table></div></section>`}

/* ---------- áp suất – nhiệt độ ---------- */
const GASES=Object.keys(D.pt);const P0=14.696;
const pOf=(g,t)=>{const k=D.pt[g];return Math.exp(k.A-k.B/(t+273.15+k.C))-P0};
const tOf=(g,p)=>{const k=D.pt[g];return k.B/(k.A-Math.log(p+P0))-k.C-273.15};
const f1=x=>(Math.round(x*10)/10).toFixed(1).replace('.',',').replace('-','−');
const f2=x=>(Math.round(x*100)/100).toFixed(2).replace('.',',').replace('-','−');
let ptGas=LS.get('hbgas','R134a'),ptUnit=LS.get('hbunit','psi');
function ptHTML(){
  const temps=[];for(let t=-40;t<=60;t+=5)temps.push(t);
  const cell=(g,t)=>{const p=pOf(g,t);const v=ptUnit==='psi'?p:p*0.0689476;return `<td class="${p<0?'vac':''}${g===ptGas?' sel':''}">${ptUnit==='psi'?f1(v):f2(v)}</td>`};
  return `<section class="hb-card hb-calc"><div class="hb-ch"><h3>Máy tính áp suất ↔ nhiệt độ bão hòa</h3></div>
   <div class="hb-chips" role="radiogroup" aria-label="Chọn gas">${GASES.map(g=>`<button type="button" class="hb-chip${g===ptGas?' on':''}" data-gas="${g}" role="radio" aria-checked="${g===ptGas}">${g}</button>`).join('')}</div>
   <div class="hb-cv"><label><span>Nhiệt độ bão hòa (°C)</span><input type="number" inputmode="decimal" step="0.5" data-pt="t" value="${LS.get('hbt',-25)}"></label><div class="hb-out" data-out="p"></div></div>
   <div class="hb-cv"><label><span>Áp suất đồng hồ (psi)</span><input type="number" inputmode="decimal" step="1" data-pt="p" value="${LS.get('hbp',10)}"></label><div class="hb-out" data-out="t"></div></div>
   <p class="hb-note">Ứng dụng: biết loại gas và nhiệt độ cần làm lạnh → tra áp suất hút; đo áp suất và nhiệt độ bình gas đang ở trạng thái bão hòa → xác định loại gas. Giá trị âm là vùng chân không (1 psi ≈ 2,04 inHg).</p></section>
   <section class="hb-card" id="hb-pt"><div class="hb-ch"><h3>Bảng áp suất – nhiệt độ bão hòa</h3><div class="hb-seg"><button type="button" data-unit="psi" class="${ptUnit==='psi'?'on':''}">psi</button><button type="button" data-unit="bar" class="${ptUnit==='bar'?'on':''}">bar</button></div></div>
   <p class="hb-note">Áp suất đồng hồ (áp suất tương đối) theo nhiệt độ bão hòa. Ô xanh nhạt: chân không. Tính theo đường cong khớp với bảng P–T của Hudson Technologies (sai số dưới 2%). R404A là gas hỗn hợp: dùng giá trị trung bình.</p>
   <div class="hb-tw hb-ptw"><table class="hb-tb hb-ptb"><thead><tr><th>°C</th>${GASES.map(g=>`<th class="${g===ptGas?'sel':''}">${g}</th>`).join('')}</tr></thead>
   <tbody>${temps.map(t=>`<tr><th>${t>0?'+':''}${String(t).replace('-','−')}</th>${GASES.map(g=>cell(g,t)).join('')}</tr>`).join('')}</tbody></table></div></section>`}
function ptUpdate(){
  const ti=main.querySelector('[data-pt=t]'),pi=main.querySelector('[data-pt=p]');if(!ti)return;
  const t=parseFloat(String(ti.value).replace(',','.')),p=parseFloat(String(pi.value).replace(',','.'));
  const po=main.querySelector('[data-out=p]'),to=main.querySelector('[data-out=t]');
  if(isFinite(t)&&t>=-60&&t<=80){const v=pOf(ptGas,t);po.innerHTML=`<b>${f1(v)} psi</b><span>${f2(v*0.0689476)} bar${v<0?` · chân không ${f1(-v*2.036)} inHg`:''}</span>`;LS.set('hbt',t)}else po.innerHTML='<span>Nhập từ −60 đến 80 °C</span>';
  if(isFinite(p)&&p>-14.5&&p<600){const v=tOf(ptGas,p);to.innerHTML=`<b>${f1(v)} °C</b><span>${ptGas} bão hòa ở ${f1(p)} psi</span>`;LS.set('hbp',p)}else to.innerHTML='<span>Nhập áp suất đồng hồ (psi)</span>'}

/* ---------- hiển thị từng mục ---------- */
function show(sec,focusId){
  mount();if(!SEC(sec))sec='loi';cur=sec;LS.set('hbsec',sec);setNav();const s=SEC(sec);let h=head(s);
  if(sec==='loi'){
    h+=`<div class="hb-chips hb-grp">${[['all','Tất cả']].concat(D.groups).map(g=>`<button type="button" class="hb-chip${grp===g[0]?' on':''}" data-grp="${g[0]}">${esc(g[1])}</button>`).join('')}</div>`;
    h+=D.faults.filter(f=>grp==='all'||f.g===grp).map(f=>fault(f)).join('');
  }else if(sec==='maloi'){h+=`<p class="hb-lead">Tủ điện tử, tủ Inverter hiển thị mã lỗi khi board phát hiện bất thường. Mã và ý nghĩa thay đổi theo đời máy – luôn đối chiếu tài liệu service của đúng model. Tủ bán tại Việt Nam có thể dùng bộ mã khác.</p>`+D.codes.map(c=>codes(c)).join('')}
  else if(sec==='pt'){h+=ptHTML()}
  else if(sec==='qt'){h+=`<p class="hb-lead">Bấm vào từng quy trình để xem các bước.</p>`+D.procs.map(p=>proc(p,null,p.id===focusId)).join('')}
  else if(sec==='at'){h+=`<section class="hb-card"><div class="hb-ch"><h3>An toàn khi sửa chữa tủ lạnh</h3></div><div class="hb-safe">${D.safety.map(r=>`<div><b>${esc(r[0])}</b><p>${esc(r[1])}</p></div>`).join('')}</div></section>
     <section class="hb-card"><div class="hb-ch"><h3>Nguồn tham khảo</h3></div><ol class="hb-src">${D.sources.map(r=>`<li>${esc(r[0])}${/^https?:/.test(r[1])?` – <a href="${esc(r[1])}" target="_blank" rel="noopener">${esc(r[1].replace(/^https?:\/\/(www\.)?/,'').replace(/\/.*$/,''))}</a>`:` – ${esc(r[1])}`}</li>`).join('')}</ol>
     <p class="hb-note">Các giá trị trong sổ tay là giá trị tham khảo theo kinh nghiệm và tài liệu nêu trên. Khi có tài liệu của nhà sản xuất cho đúng model, ưu tiên tài liệu đó.</p></section>`}
  else{h+=D.tables.filter(t=>t.sec===sec).map(t=>table(t)).join('')}
  main.innerHTML=h;main.scrollTop=0;if(sec==='pt')ptUpdate();
  if(focusId)focus(focusId);
}
function focus(id){const el=main.querySelector('#hb-'+CSS.escape(id));if(!el)return;if(el.tagName==='DETAILS')el.open=true;
  requestAnimationFrame(()=>{el.scrollIntoView({block:'start'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')})}

/* ---------- tìm trong sổ tay ---------- */
function terms(q){return nz(q).split(/\s+/).filter(Boolean)}
function hit(text,ts){const n=nz(text);return ts.every(t=>n.indexOf(t)>=0)}
function results(){
  mount();setNav();const ts=terms(query);if(!ts.length){show(cur);return}
  let n=0,h=`<div class="hb-h"><span class="hb-hic">${IC.search}</span><div><h2>Kết quả tìm “${esc(query)}”</h2><p class="hb-cnt"></p></div></div>`;
  D.faults.forEach(f=>{const whole=hit(f.sym+' '+(f.note||''),ts);const rows=f.rows.filter(r=>whole||hit(f.sym+' '+r.c+' '+r.k+' '+r.x,ts));if(rows.length){n+=rows.length;h+=fault(f,ts,rows)}});
  D.codes.forEach(c=>{const rows=c.rows.filter(r=>hit(c.brand+' '+r[0]+' '+r[1],ts));if(rows.length){n+=rows.length;h+=codes(c,ts,rows)}});
  D.tables.forEach(t=>{const whole=hit(t.title,ts);const rows=t.rows.filter(r=>whole||hit(t.title+' '+r.join(' '),ts));if(rows.length){n+=rows.length;h+=table(t,ts,rows)}});
  D.procs.forEach(p=>{if(hit(p.title+' '+p.goal+' '+(p.tools||[]).join(' ')+' '+p.steps.join(' ')+' '+(p.warn||[]).join(' '),ts)){n++;h+=proc(p,ts,true)}});
  D.safety.forEach(r=>{if(hit(r.join(' '),ts)){n++;h+=`<section class="hb-card"><div class="hb-ch"><h3>An toàn: ${hl(r[0],ts)}</h3></div><p>${hl(r[1],ts)}</p></section>`}});
  if(/(ap suat|nhiet do|psi|bar|r600a|r134a|r12|r290|r22|r404a|bao hoa)/.test(nz(query)))h+=`<section class="hb-card"><div class="hb-ch"><h3>Bảng áp suất – nhiệt độ bão hòa</h3><button type="button" class="hb-sl" data-go="pt">${IC.pt}<span>Mở bảng, máy tính</span></button></div></section>`;
  if(!n)h+=`<div class="hb-empty"><b>Không tìm thấy</b><p>Thử từ khác, ví dụ: <button type="button" data-q="sò lạnh">sò lạnh</button> <button type="button" data-q="cân cáp">cân cáp</button> <button type="button" data-q="tẹc mít">tẹc-mít</button> <button type="button" data-q="không lạnh">không lạnh</button> <button type="button" data-q="hút chân không">hút chân không</button></p></div>`;
  main.innerHTML=h;main.scrollTop=0;const c=main.querySelector('.hb-cnt');if(c)c.textContent=n?n+' mục phù hợp – bấm mục lục bên trái để quay lại':'';
}

/* ---------- sự kiện ---------- */
function onMain(e){
  const sl=e.target.closest('[data-slide]');if(sl){const i=+sl.dataset.slide;close();if(window.App)App.go(i,{jump:1});return}
  const go=e.target.closest('[data-go]');if(go){qIn.value='';query='';show(go.dataset.go);return}
  const g=e.target.closest('[data-grp]');if(g){grp=g.dataset.grp;show('loi');return}
  const gs=e.target.closest('[data-gas]');if(gs){ptGas=gs.dataset.gas;LS.set('hbgas',ptGas);const y=main.scrollTop;show('pt');main.scrollTop=y;return}
  const u=e.target.closest('[data-unit]');if(u){ptUnit=u.dataset.unit;LS.set('hbunit',ptUnit);const y=main.scrollTop;show('pt');main.scrollTop=y;return}
  const q=e.target.closest('[data-q]');if(q){qIn.value=q.dataset.q;query=q.dataset.q;results();return}
}
function onInput(e){if(e.target.matches('[data-pt]'))ptUpdate()}
function onKey(e){if(!opened)return;
  if(e.key==='Escape'){if(qIn.value&&document.activeElement===qIn){qIn.value='';query='';show(cur)}else if(!STANDALONE)close();e.preventDefault();e.stopPropagation();return}
  if((e.key==='/'||(e.key.toLowerCase()==='k'&&(e.ctrlKey||e.metaKey)))&&document.activeElement!==qIn&&!(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))){e.preventDefault();e.stopPropagation();qIn.focus();qIn.select()}}
function open(sec,id,q){
  mount();lastFocus=document.activeElement;root.hidden=false;opened=true;document.documentElement.classList.add('hb-open');
  if(q){qIn.value=q;query=q;results()}else{qIn.value='';query='';show(sec||cur,id)}
  if(!id&&!q&&window.matchMedia&&matchMedia('(min-width: 900px)').matches)setTimeout(()=>{try{qIn.focus({preventScroll:true})}catch(x){}},60);
}
function close(){if(!root||STANDALONE)return;try{qIn.blur()}catch(e){}root.hidden=true;opened=false;document.documentElement.classList.remove('hb-open');try{lastFocus&&lastFocus.focus&&lastFocus.focus()}catch(e){}}
document.addEventListener('keydown',onKey,true);
window.Handbook={open,close,isOpen:()=>opened,SECS,nz,hl,esc,IC};
if(STANDALONE){const go=()=>{const h=(location.hash||'').slice(1).split('/');open(h[0]||null,h[1]||null)};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go()}
})();

</script>
</body></html>
